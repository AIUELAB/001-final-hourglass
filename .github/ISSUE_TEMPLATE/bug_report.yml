name: 🐛 Bug Report
description: バグ報告を作成する
title: '[Bug]: '
labels: [bug, triage]
assignees:
- gunzitakashi

body:
- type: markdown
  attributes:
    value: |
      ## バグ報告

      バグを報告していただきありがとうございます。以下の情報を可能な限り詳しく記入してください。

- type: textarea
  id: description
  attributes:
    label: 📝 バグの説明
    description: 発生している問題を明確に説明してください
    placeholder: 何が起こっているか詳しく説明してください...
  validations:
    required: true

- type: textarea
  id: steps
  attributes:
    label: 🔄 再現手順
    description: バグを再現するための手順を記載してください
    placeholder: |
      1. '...'に移動
      2. '...'をクリック
      3. '...'までスクロール
      4. エラーが表示される
  validations:
    required: true

- type: textarea
  id: expected
  attributes:
    label: ✅ 期待される動作
    description: 何が起こるべきだったかを説明してください
    placeholder: 期待される結果を記載...
  validations:
    required: true

- type: textarea
  id: actual
  attributes:
    label: ❌ 実際の動作
    description: 実際に何が起こったかを説明してください
    placeholder: 実際の結果を記載...
  validations:
    required: true

- type: textarea
  id: environment
  attributes:
    label: 🖥️ 環境情報
    description: |
      実行環境の情報を記載してください
    value: |
      - OS: [e.g. macOS 14.0, Ubuntu 22.04]
      - Python: [e.g. 3.11.5]
      - ブラウザ: [e.g. Chrome 120, Safari 17]
    render: markdown
  validations:
    required: true

- type: textarea
  id: logs
  attributes:
    label: 📄 関連ログ
    description: 関連するログやエラーメッセージを貼り付けてください
    placeholder: |
      エラーメッセージやスタックトレースをここに貼り付け...
    render: shell

- type: textarea
  id: additional
  attributes:
    label: 📎 追加情報
    description: その他の関連情報があれば記載してください
    placeholder: スクリーンショット、関連Issue等...

- type: checkboxes
  id: terms
  attributes:
    label: ✔️ 確認事項
    description: 以下の項目を確認してください
    options:
    - label: 既存のIssueで同じ問題が報告されていないか確認しました
      required: true
    - label: ドキュメントを確認しましたが解決策が見つかりませんでした
      required: true
