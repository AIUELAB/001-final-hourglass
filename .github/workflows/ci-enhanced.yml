# ============================================================
# Enhanced CI/CD Pipeline with OIDC
# ============================================================
#
# Workflow Dependencies:
# - ci.yml: Handles Bandit, pip-audit, Safety, Gitleaks
# - This workflow: Handles Semgrep, container scan, compliance
#
# Note: dependency-scan is covered by ci.yml (pip-audit/safety)
# and security-scan.yml (OWASP Dependency-Check).
#
# OIDC Reference: https://docs.github.com/en/actions/security-for-github-actions/security-hardening-your-deployments/about-security-hardening-with-openid-connect
# ============================================================

name: Enhanced CI/CD Pipeline with OIDC

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # 毎日午前3時に実行（JST 12:00）
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        description: "Run with debug logging"
        required: false
        default: false

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "18"

# OIDC設定
permissions:
  contents: read
  id-token: write # OIDCトークン用
  issues: write
  pull-requests: write
  checks: write

jobs:
  # シークレットスキャン
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # フル履歴を取得（スキャン精度向上）

      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # SAST (Static Application Security Testing)
  sast:
    name: Static Security Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/secrets
            p/owasp-top-ten
            p/python

      # Banditはci.ymlのsecurity-scanジョブで実行

      - name: Upload Semgrep Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-reports
          path: |
            semgrep.sarif

  # dependency-scan はci.yml (pip-audit/safety) + security-scan.yml (OWASP) でカバー

  # コンテナスキャン
  container-scan:
    name: Container Security Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t claude-code-mcp:${{ github.sha }} .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: claude-code-mcp:${{ github.sha }}
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-results.sarif"

      - name: Run Snyk container scan
        uses: snyk/actions/docker@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: claude-code-mcp:${{ github.sha }}
          args: --severity-threshold=high
        # オプショナル: SNYK_TOKEN未設定時は失敗を許容
        continue-on-error: true

  # Compliance チェック
  compliance-check:
    name: Compliance and License Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: License Scan
        uses: fossas/fossa-action@main
        with:
          api-key: ${{ secrets.FOSSA_API_KEY }}
        # オプショナル: FOSSA_API_KEY未設定時は失敗を許容
        continue-on-error: true

      - name: Check License Compatibility
        run: |
          pip install pip-licenses
          pip-licenses --format=json --with-license-file \
            --fail-on="GPL;LGPL" --output-file licenses.json
        # ライセンス違反検出時も後続ステップを実行（結果はサマリーで評価）
        continue-on-error: true

  # セキュリティレポート集約
  security-report:
    name: Aggregate Security Reports
    runs-on: ubuntu-latest
    needs:
      [secret-scan, sast, container-scan, compliance-check]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Generate Security Summary
        run: |
          echo "# Security Scan Summary" > security-summary.md
          echo "Date: $(date)" >> security-summary.md
          echo "Commit: ${{ github.sha }}" >> security-summary.md
          echo "" >> security-summary.md

          echo "## Scan Results" >> security-summary.md
          echo "- Secret Scan: ${{ needs.secret-scan.result == 'success' && '✅' || '⚠️' }}" >> security-summary.md
          echo "- SAST: ${{ needs.sast.result == 'success' && '✅' || '⚠️' }}" >> security-summary.md
          echo "- Container Scan: ${{ needs.container-scan.result == 'success' && '✅' || (needs.container-scan.result == 'skipped' && '⏭️' || '⚠️') }}" >> security-summary.md
          echo "- Compliance Check: ${{ needs.compliance-check.result == 'success' && '✅' || '⚠️' }}" >> security-summary.md
          echo "(Dependency Scanはci.yml + security-scan.ymlで実行)" >> security-summary.md

          echo "" >> security-summary.md
          if [[ "${{ needs.secret-scan.result }}" != "success" ]] || \
             [[ "${{ needs.sast.result }}" != "success" ]] || \
             [[ "${{ needs.container-scan.result }}" == "failure" ]] || \
             [[ "${{ needs.compliance-check.result }}" == "failure" ]]; then
            echo "⚠️ **注意**: 一部のセキュリティスキャンで問題が検出されました。" >> security-summary.md
            echo "詳細はアーティファクトのレポートを確認してください。" >> security-summary.md
          fi

      - name: Upload Security Summary
        uses: actions/upload-artifact@v4
        with:
          name: security-summary
          path: security-summary.md

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('security-summary.md', 'utf8');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });
  # Note: テストジョブは ci.yml で実行されるため、ここでは削除
  # ci.yml の test (3.11/3.12) ジョブでカバレッジも生成される
