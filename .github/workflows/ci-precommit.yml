name: pre-commit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  pre-commit:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false  # LFS budget exceeded - disabled temporarily
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install Node (for prettier etc.)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install pre-commit
        run: |
          pip install pre-commit
      - name: Run pre-commit
        env:
          # CI環境ではCSVファイルに依存するフックをスキップ
          # Phase 11完了: check-meta-violations, check-fictional-name-format は有効化済み
          SKIP: check-group-names,check-episode-consistency,check-same-age-duplicates,check-person-duplicates
        run: |
          pre-commit run -a
