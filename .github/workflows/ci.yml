name: Unified CI/CD Pipeline

# 🎯 6プロジェクト共通CI/CDパイプライン
# Phase 7b-2で作成された統一ワークフローテンプレート
# ベース: 001-final-hourglass/ci.yml + security.yml

on:
  push:
    branches: [ main, master, develop, chore/* ]
  pull_request:
    branches: [ main, master, develop ]
  schedule:
    - cron: '0 3 * * *'  # Daily at 3 AM UTC (12 PM JST)

env:
  PYTHON_VERSION: '3.11'
  # CVE-2026-0994: protobuf json_format.ParseDict() DoS脆弱性
  # Fix版未公開 (protobuf 5.x.x予定), 見直し日: 2026-02-28
  PIP_AUDIT_IGNORE: '--ignore-vuln CVE-2026-0994'

permissions:
  contents: read
  security-events: write
  pull-requests: write
  checks: write

jobs:
  # ============================================
  # Job 1: コード品質チェック
  # ============================================
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install ruff mypy

      # NOTE: 段階的にフォーマット適用中
      # 現在は src/ tests/ scripts/ のみチェック
      # 他のディレクトリは順次フォーマット適用予定
      - name: Run Ruff format check
        run: |
          ruff format --check src/ tests/ scripts/ --exclude "*/_archived/*"
        continue-on-error: false

      - name: Run Ruff lint
        run: |
          ruff check src/ tests/ scripts/ --exclude "*/_archived/*"
        continue-on-error: false

      - name: Run mypy type checking
        run: |
          mypy src/ --ignore-missing-imports

  # ============================================
  # Job 2: 単体テスト（マトリックステスト）
  # ============================================
  unit-tests:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install pytest pytest-cov pytest-asyncio pytest-mock

      # NOTE: CI環境ではモック対応済みテストのみ実行
      # 他のテストはローカルデータ（MASTER_EPISODES_CURRENT.csv等）に依存
      # ローカル環境では `make ci-full` で全テスト実行可能
      # Issue #14: 段階的にテスト範囲を拡大中
      - name: Run pytest
        run: |
          pytest \
            tests/test_supabase/ \
            tests/test_deletion_logic.py -m unit \
            -v \
            --cov=src \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term
        continue-on-error: false

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.11'
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  # ============================================
  # Job 3: セキュリティスキャン
  # ============================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Gitleaks用に全履歴を取得

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit[toml] pip-audit safety

      # NOTE:
      # - 以前は continue-on-error + `|| true` で「失敗が完全に無視される」状態だった
      # - ここでは “レポートは必ず生成” しつつ、最後に集計して必要ならCIを落とす（サイレント失敗防止）
      - name: Run Security Scanners (capture exit codes)
        id: security_scanners
        shell: bash
        run: |
          set +e

          # Bandit（Pythonコードの静的セキュリティ検査）
          # pyproject.toml の [tool.bandit] skips 設定を適用
          bandit -c pyproject.toml -r src/ -f json -o bandit-report.json
          echo "bandit_exit_code=$?" >> "$GITHUB_OUTPUT"

          # pip-audit（requirements.txt を監査）
          pip-audit -r requirements.txt --desc ${{ env.PIP_AUDIT_IGNORE }} --format json --output pip-audit-report.json
          echo "pip_audit_exit_code=$?" >> "$GITHUB_OUTPUT"

          # Safety（requirements.txt を監査）
          # NOTE: safety v3 は deprecated 警告を stdout に混ぜるため、そのままだとJSONが壊れる
          # そのため一度 raw を保存し、JSON部分だけを抽出して safety-report.json に整形する
          safety check -r requirements.txt --json > safety-report.raw.txt
          echo "safety_exit_code=$?" >> "$GITHUB_OUTPUT"
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          raw = Path("safety-report.raw.txt").read_text("utf-8", errors="replace")
          start = raw.find("{")
          end = raw.rfind("}") + 1
          if start < 0 or end <= start:
              raise SystemExit("Safety出力からJSONを抽出できませんでした（stdoutにJSONが存在しない）")
          json_str = raw[start:end]
          data = json.loads(json_str)
          Path("safety-report.json").write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding="utf-8")
          PY

          set -e

      - name: Evaluate security reports (fail if findings)
        shell: bash
        env:
          BANDIT_EXIT_CODE: ${{ steps.security_scanners.outputs.bandit_exit_code }}
          PIP_AUDIT_EXIT_CODE: ${{ steps.security_scanners.outputs.pip_audit_exit_code }}
          SAFETY_EXIT_CODE: ${{ steps.security_scanners.outputs.safety_exit_code }}
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          from pathlib import Path

          def load_json(path: Path) -> dict | list | None:
              if not path.exists():
                  return None
              try:
                  return json.loads(path.read_text("utf-8", errors="replace"))
              except json.JSONDecodeError:
                  return None

          bandit = load_json(Path("bandit-report.json"))
          pip_audit = load_json(Path("pip-audit-report.json"))
          safety = load_json(Path("safety-report.json"))

          # “サイレント失敗”防止: レポートが生成されない/壊れている場合はCIを落とす
          if bandit is None:
              raise SystemExit("bandit-report.json が読み取れません（未生成 or JSON破損）")
          if pip_audit is None:
              raise SystemExit("pip-audit-report.json が読み取れません（未生成 or JSON破損）")
          if safety is None:
              raise SystemExit("safety-report.json が読み取れません（未生成 or JSON破損）")

          def parse_exit_code(name: str) -> int:
              raw = os.environ.get(name, "")
              if raw == "":
                  raise SystemExit(f"{name} が取得できません（スキャナ実行が不完全の可能性）")
              try:
                  return int(raw)
              except ValueError:
                  raise SystemExit(f"{name} の形式が不正です: {raw!r}")

          bandit_exit = parse_exit_code("BANDIT_EXIT_CODE")
          pip_audit_exit = parse_exit_code("PIP_AUDIT_EXIT_CODE")
          safety_exit = parse_exit_code("SAFETY_EXIT_CODE")

          # Bandit集計
          bandit_issue_count = 0
          bandit_high = 0
          bandit_medium = 0
          bandit_low = 0
          if isinstance(bandit, dict):
              results = bandit.get("results") or []
              if isinstance(results, list):
                  bandit_issue_count = len(results)
                  for r in results:
                      if not isinstance(r, dict):
                          continue
                      sev = str(r.get("issue_severity", "")).upper()
                      if sev == "HIGH":
                          bandit_high += 1
                      elif sev == "MEDIUM":
                          bandit_medium += 1
                      elif sev == "LOW":
                          bandit_low += 1

          # pip-audit集計（JSONは list の場合が多い）
          pip_audit_vuln_count = 0
          if isinstance(pip_audit, list):
              # 形式: [{"name": "...", "version": "...", "vulns": [...]}, ...]
              for pkg in pip_audit:
                  if isinstance(pkg, dict):
                      vulns = pkg.get("vulns")
                      if isinstance(vulns, list):
                          pip_audit_vuln_count += len(vulns)

          # safety集計（JSON形式が揺れるので保守的に）
          safety_vuln_count = 0
          if isinstance(safety, dict):
              for key in ("vulnerabilities", "vulns"):
                  vulns = safety.get(key)
                  if isinstance(vulns, list):
                      safety_vuln_count = len(vulns)
                      break

          summary_lines = [
              "## 🔒 Security Scan Summary",
              "",
              f"- Exit codes: bandit={bandit_exit}, pip-audit={pip_audit_exit}, safety={safety_exit}",
              f"- Bandit issues: {bandit_issue_count} (HIGH={bandit_high}, MEDIUM={bandit_medium}, LOW={bandit_low})",
              f"- pip-audit vulnerabilities: {pip_audit_vuln_count}",
              f"- safety vulnerabilities: {safety_vuln_count}",
              "",
          ]
          Path("security-scan-summary.md").write_text("\n".join(summary_lines), encoding="utf-8")
          print("\n".join(summary_lines))

          # 失敗条件（まずは“完全にクリーン”を目標に、検出があれば落とす）
          # 例外が必要になったら「許容ポリシー（閾値・無視リスト）」を別途設ける
          if bandit_issue_count > 0 or pip_audit_vuln_count > 0 or safety_vuln_count > 0:
              raise SystemExit(
                  f"Security findings detected: bandit={bandit_issue_count}, pip-audit={pip_audit_vuln_count}, safety={safety_vuln_count}"
              )

          # 例: スキャナ実行が失敗していた場合（ネットワーク等）は検出0でも落とす
          if bandit_exit != 0 or pip_audit_exit != 0 or safety_exit != 0:
              raise SystemExit(
                  f"Security scanners returned non-zero exit codes: bandit={bandit_exit}, pip-audit={pip_audit_exit}, safety={safety_exit}"
              )
          PY

      - name: Run Gitleaks (Secret Scanning)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            *-report.json
            safety-report.raw.txt
            security-scan-summary.md
          retention-days: 30

      - name: Post security summary to GitHub Step Summary
        if: always()
        run: |
          if [ -f security-scan-summary.md ]; then
            cat security-scan-summary.md >> $GITHUB_STEP_SUMMARY
          fi

  # ============================================
  # Job 4: CHANGELOG検証（Phase 6 P1準拠）
  # ============================================
  changelog-validation:
    name: CHANGELOG Validation
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check CHANGELOG.md exists
        run: |
          if [ ! -f CHANGELOG.md ]; then
            echo "❌ CHANGELOG.md not found"
            exit 1
          fi
          echo "✅ CHANGELOG.md exists"

      - name: Validate Keep a Changelog format
        run: |
          # Keep a Changelog形式の基本構造チェック
          if ! grep -q "# Changelog" CHANGELOG.md; then
            echo "❌ Missing '# Changelog' header"
            exit 1
          fi
          if ! grep -q "## \[Unreleased\]" CHANGELOG.md; then
            echo "❌ Missing '## [Unreleased]' section"
            exit 1
          fi
          echo "✅ Keep a Changelog format validated"

      - name: Check for Conventional Commits
        run: |
          # 直近のコミットメッセージをチェック
          git log --format=%s -n 5 | grep -E "^(feat|fix|docs|style|refactor|test|chore|perf|ci|build|revert)(\(.+\))?: " || \
            echo "⚠️  Some commits may not follow Conventional Commits format"

  # ============================================
  # Job 5: ビルド検証
  # ============================================
  build:
    name: Build Validation
    runs-on: ubuntu-latest
    needs: [code-quality, unit-tests]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build wheel setuptools

      - name: Build package
        run: |
          if [ -f pyproject.toml ]; then
            python -m build || { echo "❌ Build failed"; exit 1; }
            echo "✅ Package built successfully"
          else
            echo "ℹ️  No pyproject.toml found, skipping build step"
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: dist
          path: dist/
          retention-days: 7

  # ============================================
  # Job 6: CI結果サマリー
  # ============================================
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [code-quality, unit-tests, security-scan, changelog-validation, build]
    if: always()

    steps:
      - name: Generate CI Summary
        run: |
          echo "## 🎯 CI/CD Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Code Quality | ${{ needs.code-quality.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.unit-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scan | ${{ needs.security-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| CHANGELOG Validation | ${{ needs.changelog-validation.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # 全ジョブが成功した場合のみsuccessを表示
          if [ "${{ needs.code-quality.result }}" = "success" ] && \
             [ "${{ needs.unit-tests.result }}" = "success" ] && \
             [ "${{ needs.security-scan.result }}" = "success" ]; then
            echo "✅ **All critical checks passed!**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Some checks failed. Please review the results above.**" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Check critical failures
        run: |
          if [ "${{ needs.code-quality.result }}" != "success" ] || \
             [ "${{ needs.unit-tests.result }}" != "success" ]; then
            echo "❌ Critical jobs failed"
            exit 1
          fi
