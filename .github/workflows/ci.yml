name: Unified CI/CD Pipeline

# 🎯 6プロジェクト共通CI/CDパイプライン
# Phase 7b-2で作成された統一ワークフローテンプレート
# ベース: 001-final-hourglass/ci.yml + security.yml

on:
  push:
    branches: [ main, master, develop, chore/* ]
  pull_request:
    branches: [ main, master, develop ]
  schedule:
    - cron: '0 3 * * *'  # Daily at 3 AM UTC (12 PM JST)

env:
  PYTHON_VERSION: '3.11'

permissions:
  contents: read
  security-events: write
  pull-requests: write
  checks: write

jobs:
  # ============================================
  # Job 1: コード品質チェック
  # ============================================
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install ruff mypy

      - name: Run Ruff format check
        run: |
          ruff format --check . --exclude "*/_archived/*" --exclude "archive/*"
        continue-on-error: false

      - name: Run Ruff lint
        run: |
          ruff check . --exclude "*/_archived/*" --exclude "archive/*"
        continue-on-error: false

      - name: Run mypy type checking
        run: |
          mypy src/ --ignore-missing-imports
        continue-on-error: true

  # ============================================
  # Job 2: 単体テスト（マトリックステスト）
  # ============================================
  unit-tests:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install pytest pytest-cov pytest-asyncio pytest-mock

      - name: Run pytest
        run: |
          pytest tests/ -v \
            --cov=src \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term
        continue-on-error: false

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.11'
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
        continue-on-error: true

  # ============================================
  # Job 3: セキュリティスキャン
  # ============================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Gitleaks用に全履歴を取得

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit[toml] pip-audit safety

      - name: Run Bandit (Python Security)
        run: |
          bandit -r src/ -f json -o bandit-report.json
        continue-on-error: false

      - name: Run pip-audit (Dependency Security)
        run: |
          pip-audit --desc --format json --output pip-audit-report.json
        continue-on-error: false

      - name: Run Safety check
        run: |
          safety check --json > safety-report.json
        continue-on-error: false

      - name: Run Gitleaks (Secret Scanning)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            *-report.json
          retention-days: 30

  # ============================================
  # Job 4: CHANGELOG検証（Phase 6 P1準拠）
  # ============================================
  changelog-validation:
    name: CHANGELOG Validation
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check CHANGELOG.md exists
        run: |
          if [ ! -f CHANGELOG.md ]; then
            echo "❌ CHANGELOG.md not found"
            exit 1
          fi
          echo "✅ CHANGELOG.md exists"

      - name: Validate Keep a Changelog format
        run: |
          # Keep a Changelog形式の基本構造チェック
          if ! grep -q "# Changelog" CHANGELOG.md; then
            echo "❌ Missing '# Changelog' header"
            exit 1
          fi
          if ! grep -q "## \[Unreleased\]" CHANGELOG.md; then
            echo "❌ Missing '## [Unreleased]' section"
            exit 1
          fi
          echo "✅ Keep a Changelog format validated"

      - name: Check for Conventional Commits
        run: |
          # 直近のコミットメッセージをチェック
          git log --format=%s -n 5 | grep -E "^(feat|fix|docs|style|refactor|test|chore|perf|ci|build|revert)(\(.+\))?: " || \
            echo "⚠️  Some commits may not follow Conventional Commits format"

  # ============================================
  # Job 5: ビルド検証
  # ============================================
  build:
    name: Build Validation
    runs-on: ubuntu-latest
    needs: [code-quality, unit-tests]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build wheel setuptools

      - name: Build package
        run: |
          if [ -f pyproject.toml ]; then
            python -m build
            echo "✅ Package built successfully"
          else
            echo "⚠️  No pyproject.toml found, skipping build"
          fi
        continue-on-error: true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: dist
          path: dist/
          retention-days: 7

  # ============================================
  # Job 6: CI結果サマリー
  # ============================================
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [code-quality, unit-tests, security-scan, changelog-validation, build]
    if: always()

    steps:
      - name: Generate CI Summary
        run: |
          echo "## 🎯 CI/CD Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Code Quality | ${{ needs.code-quality.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.unit-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scan | ${{ needs.security-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| CHANGELOG Validation | ${{ needs.changelog-validation.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # 全ジョブが成功した場合のみsuccessを表示
          if [ "${{ needs.code-quality.result }}" = "success" ] && \
             [ "${{ needs.unit-tests.result }}" = "success" ] && \
             [ "${{ needs.security-scan.result }}" = "success" ]; then
            echo "✅ **All critical checks passed!**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Some checks failed. Please review the results above.**" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Check critical failures
        run: |
          if [ "${{ needs.code-quality.result }}" != "success" ] || \
             [ "${{ needs.unit-tests.result }}" != "success" ]; then
            echo "❌ Critical jobs failed"
            exit 1
          fi
