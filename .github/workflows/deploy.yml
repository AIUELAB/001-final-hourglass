name: Deploy to Production

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up kubectl
      uses: azure/setup-kubectl@v4
      with:
        version: 'v1.27.0'

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Update kubeconfig
      run: |
        aws eks update-kubeconfig \
          --region ${{ secrets.AWS_REGION }} \
          --name ${{ secrets.EKS_CLUSTER_NAME }}

    - name: Set image tag
      id: image
      run: |
        if [[ "${{ github.ref }}" == refs/tags/* ]]; then
          TAG=${GITHUB_REF#refs/tags/}
        else
          TAG=${GITHUB_SHA::8}
        fi
        echo "tag=${TAG}" >> $GITHUB_OUTPUT

    - name: Deploy to Kubernetes
      run: |
        # Update image tags in manifests
        kubectl set image deployment/quality-orchestrator \
          orchestrator=ghcr.io/${{ github.repository }}:${{ steps.image.outputs.tag }} \
          -n quality-system

        kubectl set image deployment/codex-server \
          codex=ghcr.io/${{ github.repository }}:${{ steps.image.outputs.tag }} \
          -n quality-system

        # Apply configurations
        kubectl apply -f kubernetes/namespace.yaml
        kubectl apply -f kubernetes/configmap.yaml
        kubectl apply -f kubernetes/secret.yaml
        kubectl apply -f kubernetes/deployment/
        kubectl apply -f kubernetes/service/
        kubectl apply -f kubernetes/hpa.yaml

    - name: Wait for rollout
      run: |
        kubectl rollout status deployment/quality-orchestrator -n quality-system --timeout=5m
        kubectl rollout status deployment/codex-server -n quality-system --timeout=5m

    - name: Verify deployment
      run: |
        kubectl get pods -n quality-system
        kubectl get svc -n quality-system
        kubectl get hpa -n quality-system

    - name: Run smoke tests
      run: |
        # Get service endpoint
        ENDPOINT=$(kubectl get svc quality-orchestrator -n quality-system -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')

        # Health check
        curl -f http://${ENDPOINT}:8002/health || exit 1

        # Metrics check
        curl -f http://${ENDPOINT}:9090/metrics || exit 1

    - name: Notify deployment status
      if: always()
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        text: |
          Deployment to ${{ github.event.inputs.environment || 'production' }} ${{ job.status }}
          Version: ${{ steps.image.outputs.tag }}
          Actor: ${{ github.actor }}
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        username: 'GitHub Actions'
        icon_emoji: ':rocket:'
