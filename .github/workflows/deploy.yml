name: Deploy to Production

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'production' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    timeout-minutes: 15

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up kubectl
      uses: azure/setup-kubectl@v4
      with:
        version: 'v1.27.0'

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Update kubeconfig
      run: |
        aws eks update-kubeconfig \
          --region ${{ secrets.AWS_REGION }} \
          --name ${{ secrets.EKS_CLUSTER_NAME }}

    - name: Set image tag
      id: image
      run: |
        if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
          TAG="${GITHUB_REF#refs/tags/}"
        else
          TAG="${GITHUB_SHA::8}"
        fi
        # タグ名の形式検証
        if ! echo "$TAG" | grep -qE '^[a-zA-Z0-9._-]+$'; then
          echo "::error::Invalid tag format: '$TAG'. Allowed: [a-zA-Z0-9._-]+"
          exit 1
        fi
        echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

    - name: Deploy to Kubernetes
      env:
        IMAGE_TAG: ${{ steps.image.outputs.tag }}
        CONTAINER_REGISTRY: ghcr.io/${{ github.repository }}
      run: |
        set -euo pipefail
        # Apply baseline configurations first
        kubectl apply -f kubernetes/namespace.yaml
        kubectl apply -f kubernetes/configmap.yaml
        # secret.yaml はテンプレートのみ格納。実際の秘密値は External Secrets
        # Operator 等で注入する。本ファイルに平文秘密値をコミットしないこと。
        if [ -f kubernetes/secret.yaml ]; then
          kubectl apply -f kubernetes/secret.yaml
        fi
        kubectl apply -f kubernetes/deployment/
        kubectl apply -f kubernetes/service/
        kubectl apply -f kubernetes/hpa.yaml

        # Override image tags with the release version
        kubectl set image deployment/quality-orchestrator \
          orchestrator="${CONTAINER_REGISTRY}:${IMAGE_TAG}" \
          -n quality-system

        kubectl set image deployment/codex-server \
          codex="${CONTAINER_REGISTRY}:${IMAGE_TAG}" \
          -n quality-system

    - name: Wait for rollout
      run: |
        set -euo pipefail
        kubectl rollout status deployment/quality-orchestrator -n quality-system --timeout=5m
        kubectl rollout status deployment/codex-server -n quality-system --timeout=5m

    - name: Verify deployment
      continue-on-error: true
      run: |
        # continue-on-error: true により、このステップの失敗はジョブ全体をブロックしない。
        # Pod 異常は後続の smoke test で検出される。
        kubectl get pods -n quality-system -o wide
        kubectl get svc -n quality-system
        kubectl get hpa -n quality-system
        # CrashLoopBackOff 等の異常 Pod を警告
        UNHEALTHY=$(kubectl get pods -n quality-system --no-headers | grep -v "Running\|Completed" || true)
        if [ -n "$UNHEALTHY" ]; then
          echo "::warning::Unhealthy pods detected:"
          echo "$UNHEALTHY"
        fi

    - name: Run smoke tests
      run: |
        set -euo pipefail
        MAX_RETRIES=5
        RETRY_INTERVAL=10

        # Get service endpoint
        ENDPOINT=$(kubectl get svc quality-orchestrator -n quality-system \
          -o jsonpath='{.status.loadBalancer.ingress[0].hostname}') || true
        if [ -z "$ENDPOINT" ]; then
          ENDPOINT=$(kubectl get svc quality-orchestrator -n quality-system \
            -o jsonpath='{.status.loadBalancer.ingress[0].ip}') || true
        fi
        if [ -z "$ENDPOINT" ]; then
          echo "::error::Service endpoint not available (LoadBalancer pending — neither hostname nor ip found)"
          exit 1
        fi

        # Health check with detailed status logging
        HEALTH_OK=false
        for i in $(seq 1 $MAX_RETRIES); do
          HTTP_STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "http://${ENDPOINT}:8002/health" 2>&1) && {
            HEALTH_OK=true
            break
          }
          echo "Health check attempt $i failed (HTTP $HTTP_STATUS), retrying in ${RETRY_INTERVAL}s..."
          sleep "$RETRY_INTERVAL"
        done
        if [ "$HEALTH_OK" != "true" ]; then
          echo "::error::Health check failed after $MAX_RETRIES attempts (last HTTP $HTTP_STATUS)"
          exit 1
        fi

        # Metrics check with detailed status logging
        METRICS_OK=false
        for i in $(seq 1 $MAX_RETRIES); do
          HTTP_STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "http://${ENDPOINT}:9090/metrics" 2>&1) && {
            METRICS_OK=true
            break
          }
          echo "Metrics check attempt $i failed (HTTP $HTTP_STATUS), retrying in ${RETRY_INTERVAL}s..."
          sleep "$RETRY_INTERVAL"
        done
        if [ "$METRICS_OK" != "true" ]; then
          echo "::error::Metrics check failed after $MAX_RETRIES attempts (last HTTP $HTTP_STATUS)"
          exit 1
        fi

    - name: Notify deployment status
      if: always()
      continue-on-error: true
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        text: |
          Deployment to ${{ github.event.inputs.environment || 'production' }} ${{ job.status }}
          Version: ${{ steps.image.outputs.tag }}
          Actor: ${{ github.actor }}
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        username: 'GitHub Actions'
        icon_emoji: ':rocket:'
