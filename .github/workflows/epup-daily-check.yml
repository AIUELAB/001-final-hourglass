name: EPUP Daily Quality Check

on:
  schedule:
    - cron: '0 0 * * *'  # 毎日9:00 JST (0:00 UTC)
  workflow_dispatch:  # 手動実行も可能

permissions:
  contents: read
  issues: write  # Issue作成用

jobs:
  daily-check:
    name: EPUP日次品質チェック
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Run EPUP Daily Check
        run: |
          python scripts/scheduled_epup_check.py --daily
        continue-on-error: true

      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: epup-daily-report-${{ github.run_number }}
          path: reports/epup_daily_*.json
          retention-days: 30

      - name: Create Issue on Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reports = fs.readdirSync('reports')
              .filter(f => f.startsWith('epup_daily_'))
              .sort()
              .reverse();

            if (reports.length > 0) {
              const report = JSON.parse(
                fs.readFileSync(`reports/${reports[0]}`, 'utf8')
              );

              const alerts = report.alerts || [];
              const kpiDetails = alerts.map(a =>
                `- **${a.name}**: ${a.status} (${(a.value * 100).toFixed(2)}%)`
              ).join('\n');

              const body = `## ⚠️ EPUP品質アラート

            **タイムスタンプ**: ${report.timestamp}
            **総レコード数**: ${report.total_records}

            ### アラート詳細
            ${kpiDetails}

            ### 対応
            1. \`reports/${reports[0]}\` を確認
            2. 該当KPIの修正スクリプト実行
            3. 修正後に再度 \`python scripts/scheduled_epup_check.py --daily\` 実行

            ### レポート
            [Workflow Run](${context.payload.repository.html_url}/actions/runs/${context.runId})
            `;

              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `[EPUP] 品質アラート - ${new Date().toISOString().split('T')[0]}`,
                body: body,
                labels: ['epup-alert', 'quality']
              });
            }
