name: EPUP Daily Quality Check

on:
  schedule:
    - cron: '0 0 * * *'  # 毎日9:00 JST (0:00 UTC)
  workflow_dispatch:  # 手動実行も可能

permissions:
  contents: read
  issues: write  # Issue作成用

jobs:
  daily-check:
    name: EPUP日次品質チェック
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Check meta element violations
        run: |
          python scripts/validation/detect_meta_element_violations.py --dry-run --strict

      - name: Run EPUP Daily Check
        run: |
          python scripts/batch/scheduled_epup_check.py --daily
        continue-on-error: true

      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: epup-daily-report-${{ github.run_number }}
          path: reports/epup_daily_*.json
          retention-days: 30

      - name: Create Issue on Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reports = fs.readdirSync('reports')
              .filter(f => f.startsWith('epup_daily_'))
              .sort()
              .reverse();

            if (reports.length > 0) {
              const report = JSON.parse(
                fs.readFileSync(`reports/${reports[0]}`, 'utf8')
              );

              const alerts = report.alerts || [];
              const kpiDetails = alerts.map(a =>
                `- **${a.name}**: ${a.status} (${(a.value * 100).toFixed(2)}%)`
              ).join('\n');

              const body = `## ⚠️ EPUP品質アラート

            **タイムスタンプ**: ${report.timestamp}
            **総レコード数**: ${report.total_records}

            ### アラート詳細
            ${kpiDetails}

            ### 対応
            1. \`reports/${reports[0]}\` を確認
            2. 該当KPIの修正スクリプト実行
            3. 修正後に再度 \`python scripts/batch/scheduled_epup_check.py --daily\` 実行

            ### レポート
            [Workflow Run](${context.payload.repository.html_url}/actions/runs/${context.runId})
            `;

              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `[EPUP] 品質アラート - ${new Date().toISOString().split('T')[0]}`,
                body: body,
                labels: ['epup-alert', 'quality']
              });
            }

  text-quality-gate:
    name: 文章品質ゲート（text_quality_dryrun_v2）
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      - name: Run Text Quality Gate
        id: text_quality
        run: |
          # text_quality_dryrun_v2.py を実行し、違反件数を取得
          output=$(python scripts/validation/text_quality_dryrun_v2.py 2>&1)
          echo "$output"

          # 合計件数を抽出
          total=$(echo "$output" | grep "合計:" | sed 's/.*合計: \([0-9]*\)件.*/\1/')
          echo "violation_count=$total" >> $GITHUB_OUTPUT

          # 0件でなければ失敗
          if [ "$total" != "0" ]; then
            echo "::error::文章品質違反が${total}件検出されました"
            exit 1
          fi
          echo "✅ 文章品質チェック通過（0件）"

      - name: Create Issue on Text Quality Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const violationCount = '${{ steps.text_quality.outputs.violation_count }}' || '不明';

            const body = `## 🚨 文章品質ゲート失敗

            **日時**: ${new Date().toISOString()}
            **違反件数**: ${violationCount}件

            ### 違反ルール
            - **ルールA**: 終止形の誤り（にありた→にいた等）
            - **ルールB**: 末尾句点欠落
            - **ルールC**: 導入文「は、」パターン
            - **ルールD**: 「〜は」の直後重複

            ### 対応方法
            1. 詳細確認: \`python scripts/validation/text_quality_dryrun_v2.py\`
            2. 自動修正: \`python scripts/fix/fix_text_quality.py --execute\`
            3. 再確認: \`python scripts/validation/text_quality_dryrun_v2.py\`
            4. Supabase同期: \`python scripts/supabase/migrate_csv_to_supabase.py\`

            ### レポート
            [Workflow Run](${context.payload.repository.html_url}/actions/runs/${context.runId})
            `;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: \`[文章品質] 違反検出 - \${new Date().toISOString().split('T')[0]}\`,
              body: body,
              labels: ['text-quality', 'automated']
            });

  quality-regression:
    name: 品質回帰チェック
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pytest

      - name: Run Quality Regression Check
        id: regression
        run: |
          python scripts/validation/quality_regression_check.py --json > quality_report.json
          echo "exit_code=$?" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Run Quality Regression Tests
        run: |
          pytest tests/test_quality_regression.py -v --tb=short
        continue-on-error: true

      - name: Upload Quality Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-regression-report-${{ github.run_number }}
          path: quality_report.json
          retention-days: 30

      - name: Create Issue on Quality Regression
        if: steps.regression.outputs.exit_code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let reportContent = '品質レポートの読み込みに失敗しました';

            try {
              const report = JSON.parse(fs.readFileSync('quality_report.json', 'utf8'));
              const results = report.results || {};

              const checks = Object.entries(results).map(([name, data]) => {
                const status = data.passed ? '✅' : '❌';
                const details = data.violation_rate !== undefined
                  ? `${data.violation_rate}% (閾値: ${data.threshold}%)`
                  : `${data.violation_count}件 (閾値: ${data.threshold}件)`;
                return `| ${name} | ${status} | ${details} |`;
              }).join('\n');

              reportContent = `| チェック | 結果 | 詳細 |
            |---------|------|------|
            ${checks}`;
            } catch (e) {
              console.error('Report parsing error:', e);
            }

            const body = `## 🚨 品質回帰検出

            **日時**: ${new Date().toISOString()}

            ### チェック結果
            ${reportContent}

            ### 対応方法
            1. 丁寧語漏れ: \`python scripts/validation/polite_form_normalizer.py --fix\`
            2. 私はパターン: \`python scripts/validation/fix_watashi_pattern.py --fix\`
            3. 再確認: \`python scripts/validation/quality_regression_check.py\`

            ### レポート
            [Workflow Run](${context.payload.repository.html_url}/actions/runs/${context.runId})
            `;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[品質回帰] 検出 - ${new Date().toISOString().split('T')[0]}`,
              body: body,
              labels: ['quality-regression', 'automated']
            });
