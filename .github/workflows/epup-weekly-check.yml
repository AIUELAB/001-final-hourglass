name: EPUP Weekly Quality Check

on:
  schedule:
    - cron: '0 1 * * 1'  # 毎週月曜10:00 JST (1:00 UTC)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  weekly-check:
    name: EPUP週次品質チェック
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Run EPUP Weekly Check
        run: |
          python scripts/batch/scheduled_epup_check.py --weekly

      - name: Run Age Boundary Check
        run: |
          python scripts/validation/detect_age_boundary_violations.py || echo "Age boundary check completed with warnings"

      - name: Run Group Sync Check
        run: |
          python scripts/data/sync_group_from_master.py --dry-run || echo "Group sync check completed"

      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: epup-weekly-reports-${{ github.run_number }}
          path: |
            reports/epup_weekly_*.json
            reports/age_boundary_*.json
          retention-days: 90

      - name: Create Summary Issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reports = fs.readdirSync('reports')
              .filter(f => f.startsWith('epup_weekly_'))
              .sort()
              .reverse();

            if (reports.length > 0) {
              const report = JSON.parse(
                fs.readFileSync(`reports/${reports[0]}`, 'utf8')
              );

              const kpiList = report.kpis.map(k =>
                `- **${k.name}**: ${k.status} (${(k.value * 100).toFixed(2)}%)`
              ).join('\n');

              const body = `## 📊 EPUP週次品質レポート

            **期間**: ${new Date().toISOString().split('T')[0]}
            **総合スコア**: ${(report.overall_score * 100).toFixed(2)}%
            **ステータス**: ${report.overall_status}

            ### KPI一覧
            ${kpiList}

            ### レポート
            [Workflow Run](${context.payload.repository.html_url}/actions/runs/${context.runId})
            `;

              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `[EPUP] 週次品質レポート - ${new Date().toISOString().split('T')[0]}`,
                body: body,
                labels: ['epup-report', 'weekly']
              });
            }
