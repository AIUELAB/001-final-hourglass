# iOS Fastlane - スクリーンショット生成 & メタデータアップロード
name: iOS Fastlane

on:
  pull_request:
    paths:
      - 'ios-apps/final-hourglass/**/*.swift'
      - 'ios-apps/final-hourglass/fastlane/**'
  workflow_dispatch:
    inputs:
      job:
        description: '実行するジョブ'
        required: true
        type: choice
        options:
          - screenshots
          - metadata
          - both
      version:
        description: 'App Store バージョン（例: 1.0.10）新バージョン作成時に指定'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ios-fastlane-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # 1. スクリーンショット生成
  # ============================================================
  screenshots:
    name: Screenshots
    if: >-
      github.event_name == 'pull_request' ||
      github.event.inputs.job == 'screenshots' ||
      github.event.inputs.job == 'both'
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ios-apps/final-hourglass
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup iOS
        uses: ./.github/actions/setup-ios
        with:
          cache-derived-data: 'true'

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: ios-apps/final-hourglass

      - name: Generate Screenshots
        run: bundle exec fastlane screenshots
        env:
          LC_ALL: ja_JP.UTF-8
          LANG: ja_JP.UTF-8

      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fastlane-screenshots
          path: ios-apps/final-hourglass/fastlane/screenshots/
          retention-days: 14
          if-no-files-found: warn

  # ============================================================
  # 2. メタデータアップロード
  # ============================================================
  upload-metadata:
    name: Upload Metadata
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.job == 'metadata' || github.event.inputs.job == 'both')
    runs-on: macos-15
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ios-apps/final-hourglass
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: ios-apps/final-hourglass

      - name: Validate Version Input
        if: github.event.inputs.version != ''
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid version format: '$VERSION'. Expected: X.Y.Z (e.g., 1.0.10)"
            exit 1
          fi
          echo "✅ Version format valid: $VERSION"

      - name: Validate Required Secrets
        env:
          HAS_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 != '' }}
          HAS_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID != '' }}
          HAS_API_ISSUER: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID != '' }}
        run: |
          MISSING=""
          [ "$HAS_API_KEY" != "true" ] && MISSING="$MISSING APP_STORE_CONNECT_API_KEY_BASE64"
          [ "$HAS_API_KEY_ID" != "true" ] && MISSING="$MISSING APP_STORE_CONNECT_API_KEY_ID"
          [ "$HAS_API_ISSUER" != "true" ] && MISSING="$MISSING APP_STORE_CONNECT_API_ISSUER_ID"

          if [ -n "$MISSING" ]; then
            echo "::error::Missing required secrets:$MISSING"
            exit 1
          fi
          echo "✅ All required secrets configured"

      - name: Install App Store Connect API Key
        env:
          API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          KEY_FILE="$HOME/private_keys/AuthKey_${API_KEY_ID}.p8"
          echo "$API_KEY_BASE64" | base64 --decode > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          # C4: APIキーファイルの整合性検証
          if [ ! -f "$KEY_FILE" ]; then
            echo "::error::API key file was not created"
            exit 1
          fi
          KEY_SIZE=$(wc -c < "$KEY_FILE")
          if [ "$KEY_SIZE" -lt 100 ]; then
            echo "::error::API key file is too small (${KEY_SIZE} bytes) - likely corrupted"
            exit 1
          fi
          PEM_HEADER="BEGIN PRIVATE"" KEY"
          if ! head -1 "$KEY_FILE" | grep -q "$PEM_HEADER"; then
            echo "::error::API key file does not contain valid PEM header"
            exit 1
          fi
          echo "✅ API key installed and validated (${KEY_SIZE} bytes)"

      - name: Upload Metadata
        id: upload
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_VERSION: ${{ github.event.inputs.version }}
        run: |
          ARGS=("api_key_path:$HOME/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8")
          if [ -n "$APP_VERSION" ]; then
            ARGS+=("app_version:$APP_VERSION")
          fi
          bundle exec fastlane metadata "${ARGS[@]}"

      - name: Upload Summary
        if: always()
        run: |
          if [ "${{ steps.upload.outcome }}" == "success" ]; then
            echo "## ✅ Metadata Upload Succeeded" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ❌ Metadata Upload Failed" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Bundle ID | \`com.AIUELAB.FinalHourglass\` |" >> $GITHUB_STEP_SUMMARY

      - name: Cleanup API Key
        if: always()
        run: |
          rm -rf ~/private_keys
          if [ -d ~/private_keys ]; then
            echo "::warning::Failed to remove ~/private_keys"
          else
            echo "✅ API key files cleaned up"
          fi
