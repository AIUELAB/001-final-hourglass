# iOS Quality Gate - PR時のコード品質チェック
# 3つのジョブを並列実行: Build, dependency-audit, privacy-audit
#
# 移行済み:
# - SwiftLint → .github/workflows/lint.yml (Linux runner)
# - Periphery → .pre-commit-config.yaml (ローカル実行)
# - Unit Tests + UI Tests → Xcode Cloud
#
# Phase 32: Build, Privacy Manifest Audit は main マージ前の必須チェック
name: iOS Quality Gate

on:
  pull_request:
    paths:
      - 'ios-apps/**/*.swift'
      - 'ios-apps/**/project.pbxproj'
      - 'ios-apps/**/*.xcconfig'
      - 'ios-apps/**/Package.resolved'

permissions:
  contents: read

concurrency:
  group: ios-quality-gate-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Swift Package Dependencies
        run: |
          cd ios-apps/final-hourglass
          echo "## 🔍 Swift Package Manager Dependency Audit" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # SPM Package.resolved を検索
          PACKAGE_RESOLVED=$(find . -name "Package.resolved" -path "*xcshareddata*" | head -1)

          if [ -n "$PACKAGE_RESOLVED" ]; then
            echo "### Swift Package Dependencies" >> $GITHUB_STEP_SUMMARY
            echo "✅ Package.resolved found: \`$PACKAGE_RESOLVED\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "#### Packages:" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat "$PACKAGE_RESOLVED" | head -50 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ No Package.resolved found - SPM dependencies will be resolved at build time" >> $GITHUB_STEP_SUMMARY
          fi

  build:
    name: Build
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup iOS
        uses: ./.github/actions/setup-ios
        with:
          install-xcpretty: 'true'
          cache-derived-data: 'true'

      # ビルドログをファイルに保存して後続の警告チェックで使用
      # pipefailを有効化してxcodebuildの失敗を検知
      - name: Build
        run: |
          set -o pipefail
          cd ios-apps/final-hourglass
          xcodebuild build \
            -workspace FinalHourglass.xcworkspace \
            -scheme FinalHourglass \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log | xcpretty --color

      - name: Show build log on failure
        if: failure()
        run: |
          cd ios-apps/final-hourglass
          echo "=== Build Log (last 200 lines) ==="
          tail -200 build.log || true

      # 警告チェック: システム由来の警告（appintentsmetadataprocessor等）を除外し、
      # 残りの警告があればワークフローを失敗させる
      - name: Check for Warnings
        run: |
          cd ios-apps/final-hourglass
          # 警告行を抽出し、システム由来の警告を除外（大文字小文字無視）
          WARNINGS=$(grep -i "warning:" build.log | grep -vi "appintentsmetadataprocessor" | grep -vi "swiftlint not installed" || true)

          if [ -n "$WARNINGS" ]; then
            echo "::error::ビルド警告が検出されました:"
            echo "$WARNINGS"
            exit 1
          else
            echo "警告なし - OK"
          fi

  privacy-audit:
    name: Privacy Manifest Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Privacy Manifest
        run: |
          chmod +x .github/scripts/validate-privacy-manifest.sh
          .github/scripts/validate-privacy-manifest.sh ios-apps/final-hourglass
