# iOS Quality Gate - PR時のコード品質チェック
# 3つのジョブを並列実行: Build, dependency-audit, privacy-audit
#
# 移行済み:
# - SwiftLint → .github/workflows/lint.yml (Linux runner)
# - Periphery → .pre-commit-config.yaml (ローカル実行)
# - Unit Tests + UI Tests → Xcode Cloud
#
# Phase 32: Build, Privacy Manifest Audit は main マージ前の必須チェック
name: iOS Quality Gate

on:
  pull_request:
    paths:
      - 'ios-apps/**/*.swift'
      - 'ios-apps/**/Podfile'
      - 'ios-apps/**/Podfile.lock'
      - 'ios-apps/**/project.pbxproj'
      - 'ios-apps/**/*.xcconfig'

concurrency:
  group: ios-quality-gate-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install cocoapods-audit
        run: gem install cocoapods cocoapods-audit --no-document

      - name: Run CocoaPods Audit
        run: |
          cd ios-apps/final-hourglass
          if [ -f Podfile.lock ]; then
            echo "## 🔍 CocoaPods Dependency Audit" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            if pod audit 2>&1 | tee audit_result.txt; then
              echo "✅ No known vulnerabilities found" >> $GITHUB_STEP_SUMMARY
            else
              echo "⚠️ Vulnerabilities detected:" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              cat audit_result.txt >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              exit 1
            fi
          else
            echo "ℹ️ No Podfile.lock found - skipping CocoaPods audit" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Check Swift Package Resolved
        run: |
          cd ios-apps/final-hourglass
          if [ -f Package.resolved ] || find . -name "Package.resolved" -path "*xcshareddata*" | head -1 | grep -q .; then
            echo "### Swift Package Dependencies" >> $GITHUB_STEP_SUMMARY
            echo "✅ Swift Package resolution file found" >> $GITHUB_STEP_SUMMARY
          fi

  build:
    name: Build
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup iOS
        uses: ./.github/actions/setup-ios
        with:
          install-xcpretty: 'true'
          cache-derived-data: 'true'

      # ビルドログをファイルに保存して後続の警告チェックで使用
      # pipefailを有効化してxcodebuildの失敗を検知
      - name: Build
        run: |
          set -o pipefail
          cd ios-apps/final-hourglass
          xcodebuild build \
            -project FinalHourglass.xcodeproj \
            -scheme FinalHourglass \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log | xcpretty --color

      # 警告チェック: システム由来の警告（appintentsmetadataprocessor等）を除外し、
      # 残りの警告があればワークフローを失敗させる
      - name: Check for Warnings
        run: |
          cd ios-apps/final-hourglass
          # 警告行を抽出し、システム由来の警告を除外（大文字小文字無視）
          WARNINGS=$(grep -i "warning:" build.log | grep -vi "appintentsmetadataprocessor" || true)

          if [ -n "$WARNINGS" ]; then
            echo "::error::ビルド警告が検出されました:"
            echo "$WARNINGS"
            exit 1
          else
            echo "警告なし - OK"
          fi

  privacy-audit:
    name: Privacy Manifest Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Privacy Manifest
        run: |
          chmod +x .github/scripts/validate-privacy-manifest.sh
          .github/scripts/validate-privacy-manifest.sh ios-apps/final-hourglass
