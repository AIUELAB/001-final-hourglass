# iOS Quality Gate - CI Workflow
# SwiftLint + Periphery + Build Check

name: iOS Quality Gate

on:
  pull_request:
    paths:
      - 'ios-apps/**/*.swift'
  push:
    branches:
      - main
    paths:
      - 'ios-apps/**/*.swift'

# 同時実行を制限（同一PRで複数実行を防ぐ）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =============================================
  # SwiftLint - コードスタイルチェック
  # =============================================
  swiftlint:
    name: SwiftLint
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios-apps/final-hourglass

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: |
          swiftlint version
          echo "::group::SwiftLint Results"
          # エラーのみでCI失敗（警告は許容）
          # 設定ファイル: .swiftlint.yml（自動検出）
          swiftlint lint --reporter github-actions-logging
          RESULT=$?
          echo "::endgroup::"

          # 警告カウントを表示
          WARNINGS=$(swiftlint lint --reporter json 2>/dev/null | jq 'length')
          echo "📊 SwiftLint: ${WARNINGS:-0} warnings found"

          exit $RESULT
        # Phase 2: --strict 追加で警告もエラー扱いに

  # =============================================
  # Periphery - 未使用コード検出
  # =============================================
  periphery:
    name: Periphery
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios-apps/final-hourglass
    # 初期段階ではSwiftLint成功後に実行
    needs: swiftlint
    # 失敗してもビルドは続行
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install Periphery
        run: brew install peripheryapp/periphery/periphery

      - name: Run Periphery
        run: |
          periphery version
          # --skip-build: ビルド済みの場合スキップ（CI高速化）
          # 初期は警告のみ（|| true で失敗させない）
          periphery scan --format checkstyle --quiet || true
        # 未使用コードが多い初期段階では警告のみ
        # 将来的に || true を外して厳格化

  # =============================================
  # Build - Xcodeビルドチェック
  # =============================================
  build:
    name: Build
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios-apps/final-hourglass
    needs: swiftlint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -project FinalHourglass.xcodeproj \
            -scheme FinalHourglass \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=YES \
            | xcpretty --color
        # CODE_SIGNING_ALLOWED=NO: CI環境で署名をスキップ
        # ONLY_ACTIVE_ARCH=YES: ビルド高速化
        # xcpretty: 出力を見やすく整形

  # =============================================
  # Summary - 結果サマリー
  # =============================================
  summary:
    name: Quality Gate Summary
    runs-on: ubuntu-latest
    needs: [swiftlint, periphery, build]
    if: always()

    steps:
      - name: Check results
        run: |
          echo "## iOS Quality Gate Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| SwiftLint | ${{ needs.swiftlint.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Periphery | ${{ needs.periphery.result == 'success' && '✅ Passed' || '⚠️ Warning' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY

      - name: Fail if critical checks failed
        if: needs.swiftlint.result != 'success' || needs.build.result != 'success'
        run: exit 1
