# iOS Quality Gate - PR時のコード品質チェック
# 5つのジョブを並列実行: SwiftLint, Periphery, Build, dependency-audit, privacy-audit
# Phase 32: SwiftLint, Periphery, Build, Privacy Manifest Audit は main マージ前の必須チェック
name: iOS Quality Gate

on:
  pull_request:
    paths:
      - 'ios-apps/**/*.swift'
      - 'ios-apps/**/.swiftlint.yml'
      - 'ios-apps/**/.periphery.yml'
      - 'ios-apps/**/Podfile'
      - 'ios-apps/**/Podfile.lock'
      - 'ios-apps/**/project.pbxproj'
      - 'ios-apps/**/*.xcconfig'

concurrency:
  group: ios-quality-gate-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  swiftlint:
    name: SwiftLint
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      # --strict: 警告も0件必須（警告があればエラー扱いでPRを落とす）
      - name: Run SwiftLint (Strict Mode)
        run: |
          cd ios-apps/final-hourglass
          swiftlint lint --strict --reporter github-actions-logging

  periphery:
    name: Periphery (Dead Code Detection)
    runs-on: macos-latest
    timeout-minutes: 15
    # Phase 4完了: 警告0件達成。厳格モード有効（失敗でPRを落とす）
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup iOS
        uses: ./.github/actions/setup-ios
        with:
          cache-derived-data: 'true'

      - name: Install Periphery
        run: brew install peripheryapp/periphery/periphery

      # --project と --schemes を指定してビルドしながらスキャン
      # --format checkstyle でCI連携しやすいレポート形式で出力
      # Phase 4完了: 厳格モード有効（未使用コードがあればPRを落とす）
      - name: Run Periphery
        run: |
          cd ios-apps/final-hourglass
          periphery scan \
            --project FinalHourglass.xcodeproj \
            --schemes FinalHourglass \
            --format checkstyle

  build:
    name: Build
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup iOS
        uses: ./.github/actions/setup-ios
        with:
          install-xcpretty: 'true'
          cache-derived-data: 'true'

      # ビルドログをファイルに保存して後続の警告チェックで使用
      # pipefailを有効化してxcodebuildの失敗を検知
      - name: Build
        run: |
          set -o pipefail
          cd ios-apps/final-hourglass
          xcodebuild build \
            -project FinalHourglass.xcodeproj \
            -scheme FinalHourglass \
            -destination 'platform=iOS Simulator,name=iPhone 15 Pro' \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log | xcpretty --color

      # 警告チェック: システム由来の警告（appintentsmetadataprocessor等）を除外し、
      # 残りの警告があればワークフローを失敗させる
      - name: Check for Warnings
        run: |
          cd ios-apps/final-hourglass
          # 警告行を抽出し、システム由来の警告を除外（大文字小文字無視）
          WARNINGS=$(grep -i "warning:" build.log | grep -vi "appintentsmetadataprocessor" || true)

          if [ -n "$WARNINGS" ]; then
            echo "::error::ビルド警告が検出されました:"
            echo "$WARNINGS"
            exit 1
          else
            echo "警告なし - OK"
          fi
