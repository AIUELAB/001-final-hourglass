# iOS Release v2 - CLI-integrated TestFlight配信 & GitHubリリース作成
name: iOS Release v2

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'リリースバージョン (例: 1.0.3)'
        required: true
        type: string
      dry_run:
        description: 'ドライラン（署名・アップロードをスキップ）'
        required: false
        type: boolean
        default: false
      whats_new:
        description: 'リリースノート (App Store の「このバージョンの最新情報」)'
        required: false
        type: string
        default: ''
  push:
    tags:
      - 'ios-v*'

permissions:
  contents: read

concurrency:
  group: ios-release-v2
  cancel-in-progress: false

jobs:
  # ============================================================
  # 1. バリデーション
  # ============================================================
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.value }}
      build_number: ${{ steps.version.outputs.build_number }}
      dry_run: ${{ steps.dryrun.outputs.value }}
      whats_new: ${{ steps.whats_new.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$EVENT_NAME" == "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#ios-v}"
          fi

          echo "value=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Version: $VERSION"

          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "❌ Invalid version format: $VERSION"
            echo "Expected: MAJOR.MINOR.PATCH (e.g., 1.0.3)"
            exit 1
          fi
          echo "✅ Version format valid"

          PATCH=$(echo "$VERSION" | cut -d. -f3)
          BUILD_NUMBER=$(( PATCH + ${{ github.run_number }} ))
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "🔢 Build number: $BUILD_NUMBER"

      - name: Determine Dry Run Mode
        id: dryrun
        run: |
          if [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
            echo "value=true" >> $GITHUB_OUTPUT
            echo "🧪 Dry-run mode enabled via input parameter"
          else
            echo "value=false" >> $GITHUB_OUTPUT
          fi

      - name: Check for Duplicate Tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          TAG="ios-v${{ steps.version.outputs.value }}"
          if git tag -l | grep -qx "$TAG"; then
            echo "❌ Tag $TAG already exists"
            exit 1
          fi
          echo "✅ Tag $TAG is available"

      - name: Enforce Main Branch
        if: github.event_name == 'workflow_dispatch'
        run: |
          BRANCH="${{ github.ref_name }}"
          if [ "$BRANCH" != "main" ]; then
            echo "❌ Release must be triggered from main branch (current: $BRANCH)"
            exit 1
          fi
          echo "✅ Running on main branch"

      - name: Validate Required Secrets
        env:
          HAS_CERT: ${{ secrets.DISTRIBUTION_CERTIFICATE_BASE64 != '' }}
          HAS_CERT_PW: ${{ secrets.DISTRIBUTION_CERTIFICATE_PASSWORD != '' }}
          HAS_KEYCHAIN_PW: ${{ secrets.KEYCHAIN_PASSWORD != '' }}
          HAS_PROFILE: ${{ secrets.PROVISIONING_PROFILE_BASE64 != '' }}
          HAS_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 != '' }}
          HAS_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID != '' }}
          HAS_API_ISSUER: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID != '' }}
          HAS_REPO_TOKEN: ${{ secrets.IOS_REPO_TOKEN != '' }}
        run: |
          MISSING=""

          if [ "${{ github.event.inputs.dry_run }}" == "true" ] || [ "$HAS_CERT" != "true" ]; then
            DRY_RUN=true
          else
            DRY_RUN=false
          fi

          if [ "$DRY_RUN" = "true" ]; then
            echo "⚠️ Running in dry-run mode (signing secrets not configured)"
            exit 0
          fi

          [ "$HAS_CERT" != "true" ] && MISSING="$MISSING DISTRIBUTION_CERTIFICATE_BASE64"
          [ "$HAS_CERT_PW" != "true" ] && MISSING="$MISSING DISTRIBUTION_CERTIFICATE_PASSWORD"
          [ "$HAS_KEYCHAIN_PW" != "true" ] && MISSING="$MISSING KEYCHAIN_PASSWORD"
          [ "$HAS_PROFILE" != "true" ] && MISSING="$MISSING PROVISIONING_PROFILE_BASE64"
          [ "$HAS_API_KEY" != "true" ] && MISSING="$MISSING APP_STORE_CONNECT_API_KEY_BASE64"
          [ "$HAS_API_KEY_ID" != "true" ] && MISSING="$MISSING APP_STORE_CONNECT_API_KEY_ID"
          [ "$HAS_API_ISSUER" != "true" ] && MISSING="$MISSING APP_STORE_CONNECT_API_ISSUER_ID"
          [ "$HAS_REPO_TOKEN" != "true" ] && MISSING="$MISSING IOS_REPO_TOKEN"

          if [ -n "$MISSING" ]; then
            echo "❌ Missing required secrets:$MISSING"
            exit 1
          fi
          echo "✅ All required secrets configured"

      - name: Privacy Manifest Check
        run: |
          chmod +x .github/scripts/validate-privacy-manifest.sh
          .github/scripts/validate-privacy-manifest.sh ios-apps/final-hourglass

      - name: Determine What's New
        id: whats_new
        run: |
          if [ -n "${{ github.event.inputs.whats_new }}" ]; then
            WHATS_NEW="${{ github.event.inputs.whats_new }}"
          else
            WHATS_NEW="バグ修正とパフォーマンスの改善を行いました。"
          fi
          echo "value=$WHATS_NEW" >> $GITHUB_OUTPUT
          echo "📝 What's New: $WHATS_NEW"

      - name: Validation Summary
        run: |
          echo "## ✅ Release Validation Passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Version | \`${{ steps.version.outputs.value }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Number | \`${{ steps.version.outputs.build_number }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Trigger | \`${{ github.event_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY

  # ============================================================
  # 2. ビルド & アップロード (CLI統合)
  # ============================================================
  build-upload:
    name: Build & Upload (CLI)
    needs: validate
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ios-apps/final-hourglass
    outputs:
      archive_path: ${{ steps.cli.outputs.archive_path }}
      ipa_path: ${{ steps.cli.outputs.ipa_path }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout iOS submodule
        run: git submodule update --init --recursive
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.IOS_REPO_TOKEN }}@github.com/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/
        working-directory: ${{ github.workspace }}

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app
          echo "📱 Xcode version:"
          xcodebuild -version
          echo "📦 SDK version:"
          xcrun --sdk iphoneos --show-sdk-version

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: ios-apps/final-hourglass/requirements-cli.txt

      - name: Install CLI dependencies
        run: pip install -r requirements-cli.txt

      - name: Install App Store Connect API Key
        env:
          API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          if [ -z "$API_KEY_BASE64" ]; then
            echo "⚠️ API key not configured (dry-run mode)"
            exit 0
          fi
          mkdir -p ~/private_keys
          KEY_FILE="$HOME/private_keys/AuthKey_${API_KEY_ID}.p8"
          echo "$API_KEY_BASE64" | base64 --decode > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          if [ ! -f "$KEY_FILE" ]; then
            echo "::error::API key file was not created"
            exit 1
          fi
          KEY_SIZE=$(wc -c < "$KEY_FILE")
          if [ "$KEY_SIZE" -lt 100 ]; then
            echo "::error::API key file is too small (${KEY_SIZE} bytes)"
            exit 1
          fi
          echo "✅ API key installed (${KEY_SIZE} bytes)"

      - name: Install Distribution Certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DISTRIBUTION_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [ "${{ needs.validate.outputs.dry_run }}" == "true" ] || [ -z "$CERTIFICATE_BASE64" ]; then
            echo "⚠️ Skipping certificate (dry-run mode)"
            exit 0
          fi

          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          echo "$CERTIFICATE_BASE64" | base64 --decode > $CERTIFICATE_PATH

          if [ ! -s "$CERTIFICATE_PATH" ]; then
            echo "❌ Certificate file is empty"
            exit 1
          fi

          security import $CERTIFICATE_PATH \
            -P "$CERTIFICATE_PASSWORD" \
            -f pkcs12 \
            -k $KEYCHAIN_PATH \
            -T /usr/bin/codesign \
            -T /usr/bin/productsign \
            -A 2>&1 || {
              echo "❌ Certificate import failed"
              rm -f $CERTIFICATE_PATH
              exit 1
            }
          rm -f $CERTIFICATE_PATH

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign:,productbuild:,productsign: \
            -k "$KEYCHAIN_PASSWORD" \
            $KEYCHAIN_PATH || echo "⚠️ Partition list warning (continuing)"

          security list-keychain -d user -s $KEYCHAIN_PATH $(security list-keychain -d user | tr -d '"')
          echo "✅ Distribution certificate installed"

      - name: Install Provisioning Profile
        id: profile
        env:
          PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          if [ -z "$PROFILE_BASE64" ]; then
            echo "⚠️ Skipping profile (dry-run mode)"
            exit 0
          fi
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          PROFILE_PATH=$RUNNER_TEMP/distribution.mobileprovision
          echo "$PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          PROFILE_PLIST=$(security cms -D -i "$PROFILE_PATH")
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< "$PROFILE_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" /dev/stdin <<< "$PROFILE_PLIST")

          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/${PROFILE_UUID}.mobileprovision
          rm -f "$PROFILE_PATH"

          echo "uuid=$PROFILE_UUID" >> $GITHUB_OUTPUT
          echo "name=$PROFILE_NAME" >> $GITHUB_OUTPUT
          echo "✅ Profile installed (UUID: $PROFILE_UUID)"

      - name: Generate .env.ios-release
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          printf "APP_STORE_CONNECT_API_KEY_ID=%s\n" "${API_KEY_ID}" > .env.ios-release
          printf "APP_STORE_CONNECT_API_ISSUER_ID=%s\n" "${API_ISSUER_ID}" >> .env.ios-release
          printf "APP_STORE_CONNECT_API_KEY_PATH=%s/private_keys/AuthKey_%s.p8\n" "$HOME" "${API_KEY_ID}" >> .env.ios-release
          printf "APPLE_TEAM_ID=N4UHXSGNLU\n" >> .env.ios-release
          printf "APPLE_BUNDLE_ID=com.AIUELAB.FinalHourglass\n" >> .env.ios-release
          echo "✅ .env.ios-release generated"

      - name: Generate ExportOptions.ci.plist
        id: export-options
        run: |
          EXPORT_OPTIONS_PATH="$RUNNER_TEMP/ExportOptions.ci.plist"
          PROFILE_UUID="${{ steps.profile.outputs.uuid }}"

          /usr/libexec/PlistBuddy -c "Clear dict" "$EXPORT_OPTIONS_PATH"
          /usr/libexec/PlistBuddy -c "Add :method string app-store-connect" "$EXPORT_OPTIONS_PATH"
          /usr/libexec/PlistBuddy -c "Add :teamID string N4UHXSGNLU" "$EXPORT_OPTIONS_PATH"
          /usr/libexec/PlistBuddy -c "Add :signingStyle string manual" "$EXPORT_OPTIONS_PATH"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles dict" "$EXPORT_OPTIONS_PATH"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:com.AIUELAB.FinalHourglass string ${PROFILE_UUID}" "$EXPORT_OPTIONS_PATH"
          /usr/libexec/PlistBuddy -c "Add :uploadSymbols bool true" "$EXPORT_OPTIONS_PATH"
          /usr/libexec/PlistBuddy -c "Add :stripSwiftSymbols bool true" "$EXPORT_OPTIONS_PATH"

          plutil -lint "$EXPORT_OPTIONS_PATH"
          echo "path=$EXPORT_OPTIONS_PATH" >> $GITHUB_OUTPUT
          echo "✅ ExportOptions.ci.plist generated"

      - name: Run iOS Release CLI
        id: cli
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          BUILD_NUMBER: ${{ needs.validate.outputs.build_number }}
          DRY_RUN: ${{ needs.validate.outputs.dry_run }}
          EXPORT_OPTIONS: ${{ steps.export-options.outputs.path }}
          PROVISIONING_PROFILE_NAME: ${{ steps.profile.outputs.name }}
          PROVISIONING_PROFILE_UUID: ${{ steps.profile.outputs.uuid }}
        run: |
          if [ "$DRY_RUN" == "true" ]; then
            MODE="--dry-run"
          else
            MODE="--execute"
          fi

          WHATS_NEW="${{ needs.validate.outputs.whats_new }}"

          python -m cli.ios_release \
            $MODE \
            --version "$VERSION" \
            --build-number "$BUILD_NUMBER" \
            --export-options-plist "$EXPORT_OPTIONS" \
            --whats-new "$WHATS_NEW" \
            --step validate --step version --step archive \
            --step export --step upload --step metadata --step submit --step report \
            --ci

      - name: Upload dSYM Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dSYMs-${{ needs.validate.outputs.version }}
          path: ios-apps/final-hourglass/build/FinalHourglass.xcarchive/dSYMs/
          if-no-files-found: ignore

      - name: Upload IPA Artifact
        if: steps.cli.outputs.ipa_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: IPA-${{ needs.validate.outputs.version }}
          path: ${{ steps.cli.outputs.ipa_path }}

      - name: Build Summary
        if: always()
        run: |
          echo "## 🏗️ Build & Upload Results (CLI)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Version | \`${{ needs.validate.outputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Number | \`${{ needs.validate.outputs.build_number }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Mode | \`${{ needs.validate.outputs.dry_run == 'true' && 'dry-run' || 'execute' }}\` |" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ steps.cli.outputs.ipa_path }}" ]; then
            echo "| IPA | ✅ Exported & Uploaded |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| IPA | ⚠️ Dry-run (no signing) |" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Cleanup Keychain
        if: always()
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          if [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain $KEYCHAIN_PATH
          fi

      - name: Cleanup API Key
        if: always()
        run: |
          rm -rf ~/private_keys
          if [ -d ~/private_keys ]; then
            echo "::error::SECURITY: Failed to remove ~/private_keys"
            exit 1
          fi
          echo "✅ API key files cleaned up"

  # ============================================================
  # 3. GitHubリリース作成
  # ============================================================
  create-release:
    name: Create GitHub Release
    needs: [validate, build-upload]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Changelog
        id: changelog
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          PREV_TAG=$(git tag -l 'ios-v*' --sort=-v:refname | head -1)
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s" --no-merges | head -50)
          else
            CHANGELOG=$(git log --pretty=format:"- %s" --no-merges -20)
          fi
          echo "$CHANGELOG" > changelog.txt

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
        continue-on-error: true

      - name: Create Tag
        if: github.event_name == 'workflow_dispatch' && needs.validate.outputs.dry_run != 'true'
        run: |
          TAG="ios-v${{ needs.validate.outputs.version }}"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Create GitHub Release
        if: needs.validate.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          TAG="ios-v${VERSION}"
          BUILD="${{ needs.validate.outputs.build_number }}"

          BODY="## FinalHourglass iOS v${VERSION} (Build ${BUILD})

          ### Changes
          $(cat changelog.txt)

          ### Release Info
          | Parameter | Value |
          |-----------|-------|
          | Version | \`${VERSION}\` |
          | Build | \`${BUILD}\` |
          | Bundle ID | \`com.AIUELAB.FinalHourglass\` |
          | Minimum iOS | 17.0 |
          "

          ASSETS=""
          if [ -d "release-assets/IPA-${VERSION}" ]; then
            ASSETS="$ASSETS release-assets/IPA-${VERSION}/*"
          fi
          if [ -d "release-assets/dSYMs-${VERSION}" ]; then
            cd release-assets/dSYMs-${VERSION}
            zip -r ../../dSYMs-${VERSION}.zip . 2>/dev/null || true
            cd ../..
            if [ -f "dSYMs-${VERSION}.zip" ]; then
              ASSETS="$ASSETS dSYMs-${VERSION}.zip"
            fi
          fi

          if [ -n "$ASSETS" ]; then
            gh release create "$TAG" $ASSETS \
              --title "iOS v${VERSION}" \
              --notes "$BODY"
          else
            gh release create "$TAG" \
              --title "iOS v${VERSION}" \
              --notes "$BODY"
          fi

      - name: Dry-run Release Summary
        if: needs.validate.outputs.dry_run == 'true'
        run: |
          echo "## 🧪 GitHub Release (Dry-run)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Tag creation and GitHub Release were **skipped** (dry-run mode)." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Would-be Tag | \`ios-v${{ needs.validate.outputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Number | \`${{ needs.validate.outputs.build_number }}\` |" >> $GITHUB_STEP_SUMMARY

      - name: Release Summary
        if: always() && needs.validate.outputs.dry_run != 'true'
        run: |
          echo "## 📦 GitHub Release" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | \`ios-v${{ needs.validate.outputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Release | [ios-v${{ needs.validate.outputs.version }}](${{ github.server_url }}/${{ github.repository }}/releases/tag/ios-v${{ needs.validate.outputs.version }}) |" >> $GITHUB_STEP_SUMMARY
