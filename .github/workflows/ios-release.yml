# iOS Release - TestFlight配信 & GitHubリリース作成
name: iOS Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'リリースバージョン (例: 1.0.3)'
        required: true
        type: string
      dry_run:
        description: 'ドライラン（署名・アップロードをスキップ）'
        required: false
        type: boolean
        default: false
  push:
    tags:
      - 'ios-v*'

# 同時実行防止
concurrency:
  group: ios-release
  cancel-in-progress: false

jobs:
  # ============================================================
  # 1. バリデーション
  # ============================================================
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      build_number: ${{ steps.version.outputs.build_number }}
      dry_run: ${{ steps.dryrun.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            # タグからバージョン抽出 (ios-v1.0.3 → 1.0.3)
            VERSION="${GITHUB_REF_NAME#ios-v}"
          fi

          echo "value=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Version: $VERSION"

          # セマンティックバージョン形式チェック
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "❌ Invalid version format: $VERSION"
            echo "Expected: MAJOR.MINOR.PATCH (e.g., 1.0.3)"
            exit 1
          fi
          echo "✅ Version format valid"

          # ビルド番号を生成（PATCH * 10 + run_number の末尾1桁）
          PATCH=$(echo "$VERSION" | cut -d. -f3)
          BUILD_NUMBER=$(( PATCH + ${{ github.run_number }} ))
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "🔢 Build number: $BUILD_NUMBER"

      - name: Determine Dry Run Mode
        id: dryrun
        run: |
          if [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
            echo "value=true" >> $GITHUB_OUTPUT
            echo "🧪 Dry-run mode enabled via input parameter"
          else
            echo "value=false" >> $GITHUB_OUTPUT
          fi

      - name: Check for Duplicate Tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          TAG="ios-v${{ steps.version.outputs.value }}"
          if git tag -l | grep -qx "$TAG"; then
            echo "❌ Tag $TAG already exists"
            exit 1
          fi
          echo "✅ Tag $TAG is available"

      - name: Enforce Main Branch
        if: github.event_name == 'workflow_dispatch'
        run: |
          BRANCH="${{ github.ref_name }}"
          if [ "$BRANCH" != "main" ]; then
            echo "❌ Release must be triggered from main branch (current: $BRANCH)"
            exit 1
          fi
          echo "✅ Running on main branch"

      - name: Validate Required Secrets
        env:
          HAS_CERT: ${{ secrets.DISTRIBUTION_CERTIFICATE_BASE64 != '' }}
          HAS_CERT_PW: ${{ secrets.DISTRIBUTION_CERTIFICATE_PASSWORD != '' }}
          HAS_KEYCHAIN_PW: ${{ secrets.KEYCHAIN_PASSWORD != '' }}
          HAS_PROFILE: ${{ secrets.PROVISIONING_PROFILE_BASE64 != '' }}
          HAS_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 != '' }}
          HAS_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID != '' }}
          HAS_API_ISSUER: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID != '' }}
          HAS_REPO_TOKEN: ${{ secrets.IOS_REPO_TOKEN != '' }}
        run: |
          MISSING=""

          # dry-run判定: 入力パラメータ or 署名証明書未設定
          if [ "${{ github.event.inputs.dry_run }}" == "true" ] || [ "$HAS_CERT" != "true" ]; then
            DRY_RUN=true
          else
            DRY_RUN=false
          fi

          if [ "$DRY_RUN" = "true" ]; then
            echo "⚠️ Running in dry-run mode (signing secrets not configured)"
            echo "The following secrets are missing (expected for dry-run):"
            [ "$HAS_CERT" != "true" ] && echo "  - DISTRIBUTION_CERTIFICATE_BASE64"
            [ "$HAS_CERT_PW" != "true" ] && echo "  - DISTRIBUTION_CERTIFICATE_PASSWORD"
            [ "$HAS_KEYCHAIN_PW" != "true" ] && echo "  - KEYCHAIN_PASSWORD"
            [ "$HAS_PROFILE" != "true" ] && echo "  - PROVISIONING_PROFILE_BASE64"
            [ "$HAS_API_KEY" != "true" ] && echo "  - APP_STORE_CONNECT_API_KEY_BASE64"
            [ "$HAS_API_KEY_ID" != "true" ] && echo "  - APP_STORE_CONNECT_API_KEY_ID"
            [ "$HAS_API_ISSUER" != "true" ] && echo "  - APP_STORE_CONNECT_API_ISSUER_ID"
            exit 0
          fi

          # 本番モード: 全Secrets必須
          [ "$HAS_CERT" != "true" ] && MISSING="$MISSING DISTRIBUTION_CERTIFICATE_BASE64"
          [ "$HAS_CERT_PW" != "true" ] && MISSING="$MISSING DISTRIBUTION_CERTIFICATE_PASSWORD"
          [ "$HAS_KEYCHAIN_PW" != "true" ] && MISSING="$MISSING KEYCHAIN_PASSWORD"
          [ "$HAS_PROFILE" != "true" ] && MISSING="$MISSING PROVISIONING_PROFILE_BASE64"
          [ "$HAS_API_KEY" != "true" ] && MISSING="$MISSING APP_STORE_CONNECT_API_KEY_BASE64"
          [ "$HAS_API_KEY_ID" != "true" ] && MISSING="$MISSING APP_STORE_CONNECT_API_KEY_ID"
          [ "$HAS_API_ISSUER" != "true" ] && MISSING="$MISSING APP_STORE_CONNECT_API_ISSUER_ID"
          [ "$HAS_REPO_TOKEN" != "true" ] && MISSING="$MISSING IOS_REPO_TOKEN"

          if [ -n "$MISSING" ]; then
            echo "❌ Missing required secrets for production release:"
            for SECRET in $MISSING; do
              echo "  - $SECRET"
            done
            exit 1
          fi
          echo "✅ All required secrets are configured"

      - name: Privacy Manifest Pre-Release Check
        run: |
          chmod +x .github/scripts/validate-privacy-manifest.sh
          # exit 0以外は全てリリースをブロック
          # exit 1: manifest未検出、exit 2: API未宣言
          .github/scripts/validate-privacy-manifest.sh ios-apps/final-hourglass

      - name: Validation Summary
        run: |
          echo "## ✅ Release Validation Passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Version | \`${{ steps.version.outputs.value }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Number | \`${{ steps.version.outputs.build_number }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Trigger | \`${{ github.event_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY

  # ============================================================
  # 2. ビルド & アーカイブ
  # ============================================================
  build-archive:
    name: Build & Archive
    needs: validate
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios-apps/final-hourglass
    outputs:
      archive_path: ${{ steps.archive.outputs.path }}
      ipa_path: ${{ steps.export.outputs.ipa_path }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout iOS submodule
        run: |
          git submodule update --init --recursive
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.IOS_REPO_TOKEN }}@github.com/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/
        working-directory: ${{ github.workspace }}

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      # Note: Dependencies are managed via Swift Package Manager (SPM)
      # SPM packages are resolved automatically during build

      - name: Install App Store Connect API Key
        env:
          API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          if [ -z "$API_KEY_BASE64" ]; then
            echo "⚠️ APP_STORE_CONNECT_API_KEY_BASE64 not configured"
            echo "Skipping API key installation (dry-run mode)"
            exit 0
          fi
          mkdir -p ~/private_keys
          echo "$API_KEY_BASE64" | base64 --decode > ~/private_keys/AuthKey_${API_KEY_ID}.p8
          echo "✅ API key installed"

      - name: Install Distribution Certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DISTRIBUTION_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [ "${{ needs.validate.outputs.dry_run }}" == "true" ] || [ -z "$CERTIFICATE_BASE64" ]; then
            echo "⚠️ DISTRIBUTION_CERTIFICATE_BASE64 not configured"
            echo "Skipping certificate installation (dry-run mode)"
            exit 0
          fi

          # 一時キーチェーン作成
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # 証明書インポート（秘密鍵含む）
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          echo "$CERTIFICATE_BASE64" | base64 --decode > $CERTIFICATE_PATH

          # 証明書ファイルの検証
          echo "🔍 Verifying certificate file..."
          if [ ! -s "$CERTIFICATE_PATH" ]; then
            echo "❌ Certificate file is empty or not created"
            exit 1
          fi
          echo "📄 Certificate file size: $(wc -c < $CERTIFICATE_PATH) bytes"

          # 証明書情報の確認（パスワードなしで可能な範囲）
          echo "🔍 Checking certificate contents..."
          openssl pkcs12 -info -in "$CERTIFICATE_PATH" -passin "pass:$CERTIFICATE_PASSWORD" -nokeys 2>&1 | head -20 || {
            echo "⚠️ Warning: Could not parse certificate with provided password"
            echo "This may indicate incorrect password or corrupted certificate"
          }

          security import $CERTIFICATE_PATH \
            -P "$CERTIFICATE_PASSWORD" \
            -f pkcs12 \
            -k $KEYCHAIN_PATH \
            -T /usr/bin/codesign \
            -T /usr/bin/productsign \
            -A 2>&1 || {
              echo "❌ Certificate import failed"
              echo "🔍 Attempting verbose import for debugging..."
              security import $CERTIFICATE_PATH \
                -P "$CERTIFICATE_PASSWORD" \
                -k $KEYCHAIN_PATH \
                -T /usr/bin/codesign 2>&1 || true
              rm -f $CERTIFICATE_PATH
              exit 1
            }

          # クリーンアップ
          rm -f $CERTIFICATE_PATH

          # インポート確認
          echo "🔍 Checking imported identities..."
          security find-identity -v -p codesigning $KEYCHAIN_PATH

          # パーティションリスト設定
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign:,productbuild:,productsign: \
            -k "$KEYCHAIN_PASSWORD" \
            $KEYCHAIN_PATH || {
              echo "⚠️ Warning: Could not set key partition list"
              echo "This may cause codesign to fail. Continuing anyway..."
            }

          # キーチェーンをデフォルトに追加（既存キーチェーンを保持）
          security list-keychain -d user -s $KEYCHAIN_PATH $(security list-keychain -d user | tr -d '"')

          echo "✅ Distribution certificate installed"

      - name: Install Provisioning Profile
        id: profile
        env:
          PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          if [ -z "$PROFILE_BASE64" ]; then
            echo "⚠️ PROVISIONING_PROFILE_BASE64 not configured"
            echo "Skipping provisioning profile installation (dry-run mode)"
            exit 0
          fi
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          PROFILE_PATH=$RUNNER_TEMP/distribution.mobileprovision
          echo "$PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          # プロファイル情報を取得
          PROFILE_PLIST=$(security cms -D -i "$PROFILE_PATH")
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< "$PROFILE_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" /dev/stdin <<< "$PROFILE_PLIST")
          echo "📋 Profile UUID: $PROFILE_UUID"
          echo "📋 Profile Name: $PROFILE_NAME"

          # UUID名でインストール（Xcodeが認識するため）
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/${PROFILE_UUID}.mobileprovision
          rm -f "$PROFILE_PATH"

          # Outputに設定（Archiveステップで使用）
          echo "uuid=$PROFILE_UUID" >> $GITHUB_OUTPUT
          echo "name=$PROFILE_NAME" >> $GITHUB_OUTPUT
          echo "✅ Provisioning profile installed (UUID: $PROFILE_UUID, Name: $PROFILE_NAME)"

      - name: Update Version Numbers
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          BUILD_NUMBER: ${{ needs.validate.outputs.build_number }}
        run: |
          # Info.plist経由で設定（xcconfig変数を使用）
          echo "Setting MARKETING_VERSION=$VERSION, CURRENT_PROJECT_VERSION=$BUILD_NUMBER"

      - name: Archive
        id: archive
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          BUILD_NUMBER: ${{ needs.validate.outputs.build_number }}
        run: |
          set -euo pipefail
          ARCHIVE_PATH=$RUNNER_TEMP/FinalHourglass.xcarchive

          # Secrets未設定時はCODE_SIGNING_ALLOWED=NOでビルド検証のみ
          if [ "${{ needs.validate.outputs.dry_run }}" == "true" ] || [ -z "${{ secrets.DISTRIBUTION_CERTIFICATE_BASE64 }}" ]; then
            echo "⚠️ Running in dry-run mode (no signing credentials)"
            xcodebuild archive \
              -workspace FinalHourglass.xcworkspace \
              -scheme FinalHourglass \
              -configuration Release \
              -archivePath "$ARCHIVE_PATH" \
              MARKETING_VERSION="$VERSION" \
              CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
              CODE_SIGNING_ALLOWED=NO \
              SKIP_INSTALL=NO \
              | xcpretty --color || {
                echo "❌ Archive failed (dry-run)"
                exit 1
              }
          else
            # Manual signing (Release config) + プロファイル名指定
            PROFILE_NAME="${{ steps.profile.outputs.name }}"
            echo "🔑 Using provisioning profile: $PROFILE_NAME"
            xcodebuild archive \
              -workspace FinalHourglass.xcworkspace \
              -scheme FinalHourglass \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath "$ARCHIVE_PATH" \
              MARKETING_VERSION="$VERSION" \
              CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
              PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
              || {
                echo "❌ Archive failed"
                exit 1
              }
          fi

          echo "path=$ARCHIVE_PATH" >> $GITHUB_OUTPUT
          echo "✅ Archive created at $ARCHIVE_PATH"

      - name: Export IPA
        id: export
        run: |
          set -euo pipefail
          ARCHIVE_PATH=${{ steps.archive.outputs.path }}
          EXPORT_PATH=$RUNNER_TEMP/Export
          IPA_PATH="$EXPORT_PATH/FinalHourglass.ipa"

          if [ "${{ needs.validate.outputs.dry_run }}" == "true" ] || [ -z "${{ secrets.DISTRIBUTION_CERTIFICATE_BASE64 }}" ]; then
            echo "⚠️ Skipping IPA export (dry-run mode - no signing credentials)"
            echo "ipa_path=" >> $GITHUB_OUTPUT
            exit 0
          fi

          # CI用にExportOptions.plistを生成
          EXPORT_OPTIONS_PATH="$RUNNER_TEMP/ExportOptions.ci.plist"
          PROFILE_NAME="${{ steps.profile.outputs.name }}"
          cat > "$EXPORT_OPTIONS_PATH" << PLISTEOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>N4UHXSGNLU</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.AIUELAB.FinalHourglass</key>
              <string>${PROFILE_NAME}</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
            <key>stripSwiftSymbols</key>
            <true/>
          </dict>
          </plist>
          PLISTEOF
          echo "📄 Using ExportOptions.plist: $EXPORT_OPTIONS_PATH"
          echo "📄 ExportOptions.plist content:"
          cat "$EXPORT_OPTIONS_PATH"

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$EXPORT_OPTIONS_PATH" \
            -allowProvisioningUpdates \
            || {
              echo "❌ IPA export failed"
              exit 1
            }

          # IPA生成を確実に検証（生成できていないのに次工程へ進む事故防止）
          if [ ! -f "$IPA_PATH" ]; then
            echo "❌ IPA file not found at: $IPA_PATH"
            ls -la "$EXPORT_PATH" || true
            exit 1
          fi

          echo "ipa_path=$IPA_PATH" >> $GITHUB_OUTPUT
          echo "✅ IPA exported to $IPA_PATH"

      - name: Upload dSYM Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dSYMs-${{ needs.validate.outputs.version }}
          path: ${{ steps.archive.outputs.path }}/dSYMs/
          if-no-files-found: ignore

      - name: Upload IPA Artifact
        if: steps.export.outputs.ipa_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: IPA-${{ needs.validate.outputs.version }}
          path: ${{ steps.export.outputs.ipa_path }}

      - name: Build Summary
        if: always()
        run: |
          echo "## 🏗️ Build & Archive Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Version | \`${{ needs.validate.outputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Number | \`${{ needs.validate.outputs.build_number }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Configuration | Release |" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ steps.export.outputs.ipa_path }}" ]; then
            echo "| IPA | ✅ Exported |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| IPA | ⚠️ Dry-run (no signing) |" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Cleanup Keychain
        if: always()
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          if [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain $KEYCHAIN_PATH
          fi

  # ============================================================
  # 3. TestFlightアップロード
  # ============================================================
  upload-testflight:
    name: Upload to TestFlight
    needs: [validate, build-archive]
    if: needs.build-archive.outputs.ipa_path != ''
    runs-on: macos-latest
    steps:
      - name: Download IPA
        uses: actions/download-artifact@v4
        with:
          name: IPA-${{ needs.validate.outputs.version }}
          path: ${{ runner.temp }}

      - name: Upload to TestFlight
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          # API Key再設定
          mkdir -p ~/private_keys
          echo "$API_KEY_BASE64" | base64 --decode > ~/private_keys/AuthKey_${API_KEY_ID}.p8

          xcrun notarytool submit --help > /dev/null 2>&1 || true

          # NOTE: altool is deprecated by Apple. Consider migrating to
          # `xcrun notarytool` or the App Store Connect API in a future update.
          xcrun altool --upload-app \
            --type ios \
            --file "${{ runner.temp }}/FinalHourglass.ipa" \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$API_ISSUER_ID" \
            2>&1 | tee upload_result.txt || {
              echo "❌ TestFlight upload failed"
              cat upload_result.txt
              exit 1
            }

          echo "✅ Successfully uploaded to TestFlight"

      - name: TestFlight Summary
        if: always()
        run: |
          echo "## 🚀 TestFlight Upload" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f upload_result.txt ]; then
            echo "### Upload Result" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat upload_result.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Version | \`${{ needs.validate.outputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | \`${{ needs.validate.outputs.build_number }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Bundle ID | \`com.AIUELAB.FinalHourglass\` |" >> $GITHUB_STEP_SUMMARY

  # ============================================================
  # 4. GitHubリリース作成
  # ============================================================
  create-release:
    name: Create GitHub Release
    needs: [validate, build-archive]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Changelog
        id: changelog
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          TAG="ios-v${VERSION}"

          # 前回タグからのログ取得
          PREV_TAG=$(git tag -l 'ios-v*' --sort=-v:refname | head -1)
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s" --no-merges | head -50)
          else
            CHANGELOG=$(git log --pretty=format:"- %s" --no-merges -20)
          fi

          # マルチラインをファイルに保存
          echo "$CHANGELOG" > changelog.txt
          echo "✅ Changelog generated"

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
        continue-on-error: true

      - name: Create Tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          TAG="ios-v${{ needs.validate.outputs.version }}"
          git tag "$TAG"
          git push origin "$TAG"
          echo "✅ Created and pushed tag: $TAG"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          TAG="ios-v${VERSION}"
          BUILD="${{ needs.validate.outputs.build_number }}"

          BODY="## FinalHourglass iOS v${VERSION} (Build ${BUILD})

          ### Changes
          $(cat changelog.txt)

          ### Release Info
          | Parameter | Value |
          |-----------|-------|
          | Version | \`${VERSION}\` |
          | Build | \`${BUILD}\` |
          | Bundle ID | \`com.AIUELAB.FinalHourglass\` |
          | Minimum iOS | 17.0 |
          "

          # アセットファイルを収集
          ASSETS=""
          if [ -d "release-assets/IPA-${VERSION}" ]; then
            ASSETS="$ASSETS release-assets/IPA-${VERSION}/*"
          fi
          if [ -d "release-assets/dSYMs-${VERSION}" ]; then
            # dSYMをzip圧縮
            cd release-assets/dSYMs-${VERSION}
            zip -r ../../dSYMs-${VERSION}.zip . 2>/dev/null || true
            cd ../..
            if [ -f "dSYMs-${VERSION}.zip" ]; then
              ASSETS="$ASSETS dSYMs-${VERSION}.zip"
            fi
          fi

          if [ -n "$ASSETS" ]; then
            gh release create "$TAG" $ASSETS \
              --title "iOS v${VERSION}" \
              --notes "$BODY"
          else
            gh release create "$TAG" \
              --title "iOS v${VERSION}" \
              --notes "$BODY"
          fi

          echo "✅ GitHub Release created: $TAG"

      - name: Release Summary
        if: always()
        run: |
          echo "## 📦 GitHub Release" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | \`ios-v${{ needs.validate.outputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Release | [ios-v${{ needs.validate.outputs.version }}](${{ github.server_url }}/${{ github.repository }}/releases/tag/ios-v${{ needs.validate.outputs.version }}) |" >> $GITHUB_STEP_SUMMARY
