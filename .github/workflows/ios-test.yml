# iOS Tests - PRおよびmainブランチへのpush時にテストを実行
name: iOS Tests

on:
  pull_request:
    paths:
      - 'ios-apps/**/*.swift'
      - 'ios-apps/**/Podfile'
      - 'ios-apps/**/Podfile.lock'
      - 'ios-apps/**/project.pbxproj'
  push:
    branches:
      - main
    paths:
      - 'ios-apps/**/*.swift'
      - 'ios-apps/**/Podfile'
      - 'ios-apps/**/Podfile.lock'

jobs:
  test:
    name: Unit Tests
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios-apps/final-hourglass

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios-apps/final-hourglass/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios-apps/final-hourglass/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install CocoaPods
        run: pod install --repo-update

      - name: Install xcpretty
        run: gem install xcpretty

      - name: Run Tests
        run: |
          set -o pipefail
          xcodebuild test \
            -workspace FinalHourglass.xcworkspace \
            -scheme FinalHourglass \
            -destination 'platform=iOS Simulator,name=iPhone 15 Pro' \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty --color

      - name: Upload Test Results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ios-apps/final-hourglass/TestResults.xcresult
