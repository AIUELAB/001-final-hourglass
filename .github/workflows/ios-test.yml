# iOS Tests - PRおよびmainブランチへのpush時にテストを実行
name: iOS Tests

on:
  workflow_dispatch:
    inputs:
      skip_coverage_check:
        description: 'カバレッジ閾値チェックをスキップ'
        required: false
        default: false
        type: boolean
  pull_request:
    paths:
      - 'ios-apps/**/*.swift'
      - 'ios-apps/**/Podfile'
      - 'ios-apps/**/Podfile.lock'
      - 'ios-apps/**/project.pbxproj'
      - 'ios-apps/**/FinalHourglassUITests/**'
      - 'ios-apps/**/*.xcconfig'
  push:
    branches:
      - main
    paths:
      - 'ios-apps/**/*.swift'
      - 'ios-apps/**/Podfile'
      - 'ios-apps/**/Podfile.lock'
      - 'ios-apps/**/project.pbxproj'
      - 'ios-apps/**/FinalHourglassUITests/**'
      - 'ios-apps/**/*.xcconfig'

concurrency:
  group: ios-test-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      ui-tests-needed: ${{ steps.filter.outputs.ui-tests }}
      src-changed: ${{ steps.filter.outputs.src }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            src:
              - 'ios-apps/**/*.swift'
              - 'ios-apps/**/Podfile'
              - 'ios-apps/**/Podfile.lock'
              - 'ios-apps/**/project.pbxproj'
              - 'ios-apps/**/*.xcconfig'
            ui-tests:
              - 'ios-apps/**/FinalHourglassUITests/**'
              - 'ios-apps/**/*.swift'
              - 'ios-apps/**/project.pbxproj'

  test:
    name: Unit Tests & Coverage
    needs: detect-changes
    if: needs.detect-changes.outputs.src-changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios-apps/final-hourglass

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout iOS submodule
        run: |
          git submodule update --init --recursive
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.IOS_REPO_TOKEN }}@github.com/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/
        working-directory: ${{ github.workspace }}

      - name: Setup iOS
        uses: ./.github/actions/setup-ios
        with:
          install-cocoapods: 'true'
          install-xcpretty: 'true'
          cache-derived-data: 'true'

      - name: Run Tests with Coverage
        run: |
          set -o pipefail
          xcodebuild test \
            -workspace FinalHourglass.xcworkspace \
            -scheme FinalHourglass \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty --color

      - name: Generate Coverage Report
        if: always()
        run: |
          echo "## 📊 Code Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # 全体カバレッジを抽出
          TOTAL_COVERAGE=$(xcrun xccov view --report TestResults.xcresult 2>/dev/null | grep "FinalHourglass.app" | head -1 | grep -oE '[0-9]+\.[0-9]+%')
          echo "**Overall Coverage:** \`$TOTAL_COVERAGE\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # コアロジックのカバレッジを表示
          echo "### Core Logic Coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| File | Coverage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|----------|--------|" >> $GITHUB_STEP_SUMMARY

          # 主要ファイルのカバレッジを抽出（閾値判定付き）
          xcrun xccov view --report TestResults.xcresult 2>/dev/null | grep -E "^\s+/.*(LifeExpectancyCalculator|HealthScoreCalculator|Prefecture|UserModel|SupabaseManager|SupabaseConfig|EpisodeManager|CacheManager|AppStateManager|NotificationManager)\.swift" | while read line; do
            FILE=$(basename "$(echo "$line" | awk '{print $1}')")
            COV=$(echo "$line" | grep -oE '[0-9]+\.[0-9]+%')
            COV_NUM=$(echo "$COV" | grep -oE '[0-9]+\.[0-9]+')

            # ステータス判定（80%閾値）
            if (( $(echo "$COV_NUM >= 80" | bc -l) )); then
              STATUS="✅"
            else
              STATUS="⚠️"
            fi
            echo "| $FILE | $COV | $STATUS |" >> $GITHUB_STEP_SUMMARY
          done

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "_Threshold: 80% for core logic (LifeExpectancyCalculator, HealthScoreCalculator, UserModel)_" >> $GITHUB_STEP_SUMMARY
          echo "_Note: SupabaseManager/Config, EpisodeManager, CacheManager, AppStateManager, NotificationManager are monitored but not enforced_" >> $GITHUB_STEP_SUMMARY

          # カバレッジ値をファイルに保存（後続ステップで使用）
          echo "$TOTAL_COVERAGE" > coverage_value.txt

      # Phase 6: カバレッジ比較機能（PR時のみ）
      - name: Download Base Coverage
        if: github.event_name == 'pull_request'
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          workflow: ios-test.yml
          branch: main
          name: coverage-report
          path: base-coverage

      - name: Compare Coverage
        if: github.event_name == 'pull_request'
        id: coverage-compare
        run: |
          echo "📊 Comparing coverage with main branch..."

          # 現在のカバレッジ
          CURRENT_COV=$(cat coverage_value.txt | grep -oE '[0-9]+\.[0-9]+' || echo "0")
          echo "current_coverage=$CURRENT_COV" >> $GITHUB_OUTPUT

          # ベースカバレッジを取得（存在する場合）
          if [ -d "base-coverage" ] && [ -f "base-coverage/TestResults.xcresult" ]; then
            BASE_COV=$(xcrun xccov view --report base-coverage/TestResults.xcresult 2>/dev/null | grep "FinalHourglass.app" | head -1 | grep -oE '[0-9]+\.[0-9]+' || echo "0")
          else
            BASE_COV="0"
            echo "⚠️ No base coverage found (first run or main branch has no coverage)"
          fi
          echo "base_coverage=$BASE_COV" >> $GITHUB_OUTPUT

          # 差分計算
          if [ "$BASE_COV" != "0" ]; then
            DIFF=$(echo "$CURRENT_COV - $BASE_COV" | bc -l)
            DIFF_FORMATTED=$(printf "%+.2f" $DIFF)
            echo "coverage_diff=$DIFF_FORMATTED" >> $GITHUB_OUTPUT

            # Step Summaryに追記
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 📈 Coverage Comparison" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Branch | Coverage |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|----------|" >> $GITHUB_STEP_SUMMARY
            echo "| main | ${BASE_COV}% |" >> $GITHUB_STEP_SUMMARY
            echo "| PR | ${CURRENT_COV}% |" >> $GITHUB_STEP_SUMMARY
            echo "| **Diff** | **${DIFF_FORMATTED}%** |" >> $GITHUB_STEP_SUMMARY
          else
            echo "coverage_diff=N/A" >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 📈 Coverage Comparison" >> $GITHUB_STEP_SUMMARY
            echo "_No base coverage available for comparison_" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            // カバレッジ値を読み取り
            const currentCoverage = '${{ steps.coverage-compare.outputs.current_coverage }}' || 'N/A';
            const baseCoverage = '${{ steps.coverage-compare.outputs.base_coverage }}' || 'N/A';
            const coverageDiff = '${{ steps.coverage-compare.outputs.coverage_diff }}' || 'N/A';

            // カバレッジ差分の絵文字を決定
            let diffEmoji = '➡️';
            if (coverageDiff !== 'N/A') {
              const diff = parseFloat(coverageDiff);
              if (diff > 0) diffEmoji = '📈';
              else if (diff < 0) diffEmoji = '📉';
            }

            // 閾値状態を判定
            const threshold = 80;
            const currentNum = parseFloat(currentCoverage);
            const thresholdStatus = currentNum >= threshold ? '✅ Passing' : '⚠️ Below threshold';

            const body = `## 📊 iOS Code Coverage Report

            | Metric | Value |
            |--------|-------|
            | **Current Coverage** | ${currentCoverage}% |
            | **Base Coverage (main)** | ${baseCoverage}% |
            | **Difference** | ${diffEmoji} ${coverageDiff}% |
            | **Threshold (80%)** | ${thresholdStatus} |

            <details>
            <summary>ℹ️ Coverage Details</summary>

            - **Core Logic Files**: LifeExpectancyCalculator, HealthScoreCalculator, UserModel (80% threshold enforced)
            - **Monitored Files**: SupabaseManager, EpisodeManager, CacheManager, AppStateManager, NotificationManager (no threshold)

            </details>

            ---
            _Generated by iOS Tests workflow_`;

            // 既存のコメントを検索
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('📊 iOS Code Coverage Report')
            );

            if (botComment) {
              // 既存のコメントを更新
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
              console.log('Updated existing coverage comment');
            } else {
              // 新規コメントを作成
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
              console.log('Created new coverage comment');
            }

      # Phase 6: READMEバッジ更新（mainブランチへのpush時のみ）
      - name: Update Coverage Badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GIST_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          echo "🏷️ Updating coverage badge..."

          # カバレッジ値を取得
          COVERAGE=$(cat coverage_value.txt | grep -oE '[0-9]+\.[0-9]+' || echo "0")
          COVERAGE_INT=$(printf "%.0f" $COVERAGE)

          # 色を決定
          if [ "$COVERAGE_INT" -ge 80 ]; then
            COLOR="brightgreen"
          elif [ "$COVERAGE_INT" -ge 60 ]; then
            COLOR="yellow"
          else
            COLOR="red"
          fi

          # shields.io形式のJSON作成
          JSON_CONTENT=$(cat <<EOF
          {
            "schemaVersion": 1,
            "label": "coverage",
            "message": "${COVERAGE_INT}%",
            "color": "${COLOR}"
          }
          EOF
          )

          # gistを更新
          echo "$JSON_CONTENT" > coverage-badge.json
          gh gist edit de3143ec1dd892d01b9f4c7bb06baab0 coverage-badge.json || echo "⚠️ Failed to update gist (GIST_TOKEN may be missing)"

      - name: Coverage Threshold Check
        if: ${{ github.event.inputs.skip_coverage_check != 'true' }}
        run: |
          echo "🔍 Checking coverage thresholds for core calculation logic..."
          THRESHOLD=80
          FAILED=0

          # LifeExpectancyCalculator のカバレッジチェック
          LIFE_COV=$(xcrun xccov view --report TestResults.xcresult 2>/dev/null | grep "LifeExpectancyCalculator.swift" | head -1 | grep -oE '[0-9]+\.[0-9]+' | head -1)
          if [ -n "$LIFE_COV" ]; then
            if (( $(echo "$LIFE_COV < $THRESHOLD" | bc -l) )); then
              echo "❌ LifeExpectancyCalculator.swift: ${LIFE_COV}% < ${THRESHOLD}%"
              FAILED=1
            else
              echo "✅ LifeExpectancyCalculator.swift: ${LIFE_COV}% >= ${THRESHOLD}%"
            fi
          else
            echo "⚠️ LifeExpectancyCalculator.swift: Coverage data not found"
          fi

          # HealthScoreCalculator のカバレッジチェック
          HEALTH_COV=$(xcrun xccov view --report TestResults.xcresult 2>/dev/null | grep "HealthScoreCalculator.swift" | head -1 | grep -oE '[0-9]+\.[0-9]+' | head -1)
          if [ -n "$HEALTH_COV" ]; then
            if (( $(echo "$HEALTH_COV < $THRESHOLD" | bc -l) )); then
              echo "❌ HealthScoreCalculator.swift: ${HEALTH_COV}% < ${THRESHOLD}%"
              FAILED=1
            else
              echo "✅ HealthScoreCalculator.swift: ${HEALTH_COV}% >= ${THRESHOLD}%"
            fi
          else
            echo "⚠️ HealthScoreCalculator.swift: Coverage data not found"
          fi

          # UserModel のカバレッジチェック
          USER_COV=$(xcrun xccov view --report TestResults.xcresult 2>/dev/null | grep "UserModel.swift" | head -1 | grep -oE '[0-9]+\.[0-9]+' | head -1)
          if [ -n "$USER_COV" ]; then
            if (( $(echo "$USER_COV < $THRESHOLD" | bc -l) )); then
              echo "❌ UserModel.swift: ${USER_COV}% < ${THRESHOLD}%"
              FAILED=1
            else
              echo "✅ UserModel.swift: ${USER_COV}% >= ${THRESHOLD}%"
            fi
          else
            echo "⚠️ UserModel.swift: Coverage data not found"
          fi

          # SupabaseManager/Config は情報表示のみ（閾値チェックなし）
          SUPA_COV=$(xcrun xccov view --report TestResults.xcresult 2>/dev/null | grep "SupabaseManager.swift" | head -1 | grep -oE '[0-9]+\.[0-9]+' | head -1)
          if [ -n "$SUPA_COV" ]; then
            echo "ℹ️ SupabaseManager.swift: ${SUPA_COV}% (monitored, no threshold)"
          fi

          # EpisodeManager/CacheManager は情報表示のみ（閾値チェックなし）
          EPISODE_COV=$(xcrun xccov view --report TestResults.xcresult 2>/dev/null | grep "EpisodeManager.swift" | head -1 | grep -oE '[0-9]+\.[0-9]+' | head -1)
          if [ -n "$EPISODE_COV" ]; then
            echo "ℹ️ EpisodeManager.swift: ${EPISODE_COV}% (monitored, no threshold)"
          fi

          CACHE_COV=$(xcrun xccov view --report TestResults.xcresult 2>/dev/null | grep "CacheManager.swift" | head -1 | grep -oE '[0-9]+\.[0-9]+' | head -1)
          if [ -n "$CACHE_COV" ]; then
            echo "ℹ️ CacheManager.swift: ${CACHE_COV}% (monitored, no threshold)"
          fi

          # AppStateManager は情報表示のみ（閾値チェックなし）
          APPSTATE_COV=$(xcrun xccov view --report TestResults.xcresult 2>/dev/null | grep "AppStateManager.swift" | head -1 | grep -oE '[0-9]+\.[0-9]+' | head -1)
          if [ -n "$APPSTATE_COV" ]; then
            echo "ℹ️ AppStateManager.swift: ${APPSTATE_COV}% (monitored, no threshold)"
          fi

          # NotificationManager は情報表示のみ（閾値チェックなし）
          NOTIFICATION_COV=$(xcrun xccov view --report TestResults.xcresult 2>/dev/null | grep "NotificationManager.swift" | head -1 | grep -oE '[0-9]+\.[0-9]+' | head -1)
          if [ -n "$NOTIFICATION_COV" ]; then
            echo "ℹ️ NotificationManager.swift: ${NOTIFICATION_COV}% (monitored, no threshold)"
          fi

          # 結果判定
          if [ $FAILED -eq 1 ]; then
            echo ""
            echo "❌ Coverage threshold check FAILED"
            echo "Please add more tests to achieve 80% coverage for core calculation logic."
            exit 1
          else
            echo ""
            echo "✅ Coverage threshold check PASSED"
          fi

      # Phase 11: パフォーマンステスト結果サマリー
      - name: Performance Test Summary
        if: always()
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## ⚡ Performance Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Threshold | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-----------|--------|" >> $GITHUB_STEP_SUMMARY

          # xcresultからパフォーマンスメトリクスを抽出
          if [ -d "TestResults.xcresult" ]; then
            # 起動時間チェック
            LAUNCH_TIME=$(xcrun xcresulttool get --path TestResults.xcresult --format json 2>/dev/null | \
              python3 -c "
          import json, sys
          try:
              data = json.load(sys.stdin)
              def find_metric(obj, name):
                  if isinstance(obj, dict):
                      test_name = obj.get('name', {}).get('_value', '')
                      if 'LaunchTime' in test_name or 'AppLaunch' in test_name:
                          duration = obj.get('duration', {}).get('_value', '')
                          if duration:
                              return duration
                      for v in obj.values():
                          r = find_metric(v, name)
                          if r: return r
                  elif isinstance(obj, list):
                      for item in obj:
                          r = find_metric(item, name)
                          if r: return r
                  return None
              result = find_metric(data, 'launch')
              print(result if result else 'N/A')
          except: print('N/A')
          " 2>/dev/null || echo "N/A")

            if [ "$LAUNCH_TIME" != "N/A" ]; then
              LAUNCH_STATUS="✅"
              LAUNCH_NUM=$(echo "$LAUNCH_TIME" | grep -oE '[0-9]+\.?[0-9]*' | head -1)
              if [ -n "$LAUNCH_NUM" ] && (( $(echo "$LAUNCH_NUM > 3.0" | bc -l 2>/dev/null) )); then
                LAUNCH_STATUS="⚠️ >3s"
              fi
              echo "| App Launch Time | < 3s | $LAUNCH_STATUS ($LAUNCH_TIME) |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| App Launch Time | < 3s | ℹ️ Measured (see xcresult) |" >> $GITHUB_STEP_SUMMARY
            fi

            echo "| Memory Footprint | < 200MB | ℹ️ Measured (see xcresult) |" >> $GITHUB_STEP_SUMMARY
            echo "| Clock Calculation | Baseline | ℹ️ Measured (see xcresult) |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| App Launch Time | < 3s | ⚠️ No results |" >> $GITHUB_STEP_SUMMARY
            echo "| Memory Footprint | < 200MB | ⚠️ No results |" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "_Thresholds per TestingGuidelines.md Phase 3: Launch < 3s, Memory < 200MB_" >> $GITHUB_STEP_SUMMARY

      # Phase 13: セキュリティテスト結果サマリー
      - name: Security Test Summary
        if: always()
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🔒 Security Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test | Description | Category |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------------|----------|" >> $GITHUB_STEP_SUMMARY
          echo "| No Hardcoded Secrets | ソースコード内の秘密鍵ハードコード検出 | API Key Security |" >> $GITHUB_STEP_SUMMARY
          echo "| Anon Key Configuration | xcconfig経由のキー読み込み検証 | API Key Security |" >> $GITHUB_STEP_SUMMARY
          echo "| Invalid Config Detection | 空文字・テンプレート値の検出 | API Key Security |" >> $GITHUB_STEP_SUMMARY
          echo "| HTTPS Enforcement | Project URLのHTTPSスキーム強制 | API Key Security |" >> $GITHUB_STEP_SUMMARY
          echo "| UserDefaults Safety | 機密データの平文保存検出 | Data Protection |" >> $GITHUB_STEP_SUMMARY
          echo "| Health Data Memory | 健康データのメモリ管理検証 | Data Protection |" >> $GITHUB_STEP_SUMMARY
          echo "| Birth Year Validation | 生年の境界値検証 | Input Validation |" >> $GITHUB_STEP_SUMMARY
          echo "| BMI Invalid Input | 不正入力でのBMI計算検証 | Input Validation |" >> $GITHUB_STEP_SUMMARY
          echo "| Config Validation | 無効設定の拒否検証 | Configuration |" >> $GITHUB_STEP_SUMMARY
          echo "| Table Name Sanitization | SQLインジェクション文字検出 | Configuration |" >> $GITHUB_STEP_SUMMARY

      # Phase 14: App Store Guidelines準拠テスト結果サマリー
      - name: App Store Guidelines Test Summary
        if: always()
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📋 App Store Guidelines Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test | Description | Guideline |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------------|-----------|" >> $GITHUB_STEP_SUMMARY
          echo "| Privacy Policy Exists | プライバシーポリシーの存在確認 | 5.1.1 Privacy |" >> $GITHUB_STEP_SUMMARY
          echo "| Terms of Service Exists | 利用規約の存在確認 | 5.1.1 Privacy |" >> $GITHUB_STEP_SUMMARY
          echo "| Notification Usage Description | 通知使用目的の説明確認 | 5.1.1 Privacy |" >> $GITHUB_STEP_SUMMARY
          echo "| User Data Storage Keys | ユーザーデータ保存キーの妥当性 | 5.1.2 Data Transparency |" >> $GITHUB_STEP_SUMMARY
          echo "| No Tracking Frameworks | 不要トラッキングSDKの排除確認 | 5.1.2 Data Transparency |" >> $GITHUB_STEP_SUMMARY
          echo "| Bundle Identifier Format | Bundle IDの逆ドメイン形式確認 | 2.3 Metadata |" >> $GITHUB_STEP_SUMMARY
          echo "| App Version Format | セマンティックバージョニング形式確認 | 2.3 Metadata |" >> $GITHUB_STEP_SUMMARY
          echo "| Accessibility Identifiers | 主要UIのアクセシビリティ識別子確認 | 4.0 Design |" >> $GITHUB_STEP_SUMMARY
          echo "| Launch Arguments | テスト用Launch Arguments動作確認 | 4.0 Design |" >> $GITHUB_STEP_SUMMARY
          echo "| Content Filter Manager | コンテンツフィルタリング機能の存在確認 | 1.2 Content |" >> $GITHUB_STEP_SUMMARY

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ios-apps/final-hourglass/TestResults.xcresult
          retention-days: 30

      - name: Upload Test Results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ios-apps/final-hourglass/TestResults.xcresult
          retention-days: 7

  ui-test:
    name: UI Tests (E2E)
    needs: detect-changes
    if: needs.detect-changes.outputs.ui-tests-needed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios-apps/final-hourglass

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout iOS submodule
        run: |
          git submodule update --init --recursive
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.IOS_REPO_TOKEN }}@github.com/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/
        working-directory: ${{ github.workspace }}

      - name: Setup iOS
        uses: ./.github/actions/setup-ios
        with:
          install-cocoapods: 'true'
          cache-derived-data: 'true'

      - name: Boot Simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available | grep "iPhone 16" | head -1 | grep -oE '[0-9A-F-]{36}')
          xcrun simctl boot "$DEVICE_ID" || true

      - name: Run UI Tests with Retry
        id: ui_tests
        run: |
          set -o pipefail
          RETRY_COUNT=0
          MAX_RETRIES=2
          SUCCESS=false

          for i in $(seq 1 $MAX_RETRIES); do
            echo "🔄 UI Test attempt $i/$MAX_RETRIES"
            RETRY_COUNT=$i

            if xcodebuild test \
              -workspace FinalHourglass.xcworkspace \
              -scheme FinalHourglass \
              -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
              -only-testing:FinalHourglassUITests \
              -retry-tests-on-failure \
              -test-iterations 2 \
              -resultBundlePath "UITestResults_attempt${i}.xcresult" \
              CODE_SIGNING_ALLOWED=NO \
              2>&1 | xcpretty --color; then
              SUCCESS=true
              break
            fi
            echo "⚠️ Attempt $i failed, retrying..."
          done

          echo "retry_count=$RETRY_COUNT" >> $GITHUB_OUTPUT
          echo "success=$SUCCESS" >> $GITHUB_OUTPUT

          if [ "$SUCCESS" != "true" ]; then
            echo "❌ UI Tests failed after $MAX_RETRIES attempts"
            exit 1
          fi

      - name: Extract Screenshots from xcresult
        if: failure()
        run: |
          mkdir -p screenshots
          for result in UITestResults_attempt*.xcresult; do
            if [ -d "$result" ]; then
              xcrun xcresulttool get --path "$result" --format json 2>/dev/null | \
                python3 -c "
          import json, sys, subprocess
          try:
              data = json.load(sys.stdin)
              attachments = []
              def find_attachments(obj):
                  if isinstance(obj, dict):
                      if obj.get('_type', {}).get('_name') == 'ActionTestAttachment':
                          ref = obj.get('payloadRef', {}).get('id', {}).get('_value', '')
                          name = obj.get('filename', {}).get('_value', 'screenshot')
                          if ref:
                              attachments.append((ref, name))
                      for v in obj.values():
                          find_attachments(v)
                  elif isinstance(obj, list):
                      for item in obj:
                          find_attachments(item)
              find_attachments(data)
              for ref, name in attachments:
                  subprocess.run(['xcrun', 'xcresulttool', 'get', '--path', '${result}', '--id', ref, '--output-path', f'screenshots/{name}'])
          except: pass
          " || true
            fi
          done

      - name: Upload UI Test Screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-screenshots
          path: ios-apps/final-hourglass/screenshots/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload UI Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: ios-apps/final-hourglass/UITestResults_attempt*.xcresult
          if-no-files-found: ignore
          retention-days: 7

      - name: UI Test Summary
        if: always()
        run: |
          echo "## 🧪 UI Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          RETRY_COUNT="${{ steps.ui_tests.outputs.retry_count }}"
          SUCCESS="${{ steps.ui_tests.outputs.success }}"
          if [ "$SUCCESS" == "true" ]; then
            echo "✅ **Status:** Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Status:** Failed" >> $GITHUB_STEP_SUMMARY
          fi
          echo "🔄 **Attempts:** ${RETRY_COUNT}" >> $GITHUB_STEP_SUMMARY
          if [ "$RETRY_COUNT" != "1" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ _Tests required retry to pass_" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ♿ Accessibility Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test | Description |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------------|" >> $GITHUB_STEP_SUMMARY
          echo "| VoiceOver Labels | 主要UI要素のaccessibilityLabel設定検証 |" >> $GITHUB_STEP_SUMMARY
          echo "| Dynamic Type | フォントサイズ変更後のUI表示検証 |" >> $GITHUB_STEP_SUMMARY
          echo "| Color Contrast | テキスト読み取り可能性検証 |" >> $GITHUB_STEP_SUMMARY
          echo "| Accessibility Traits | ボタン・ラベルのtraits設定検証 |" >> $GITHUB_STEP_SUMMARY
