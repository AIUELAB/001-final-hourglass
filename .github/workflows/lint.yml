# SwiftLint - 公式 Docker image (SourceKit同梱) で実行
# ubuntu-latest、無料枠消費なし
# Note: SwiftLint は Linux 上で lint 完了後に SourceKit 終了待ちでハングするため
#       timeout 60秒 + 出力ファイル方式で回避
name: SwiftLint

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'ios-apps/**/*.swift'
      - 'ios-apps/**/.swiftlint.yml'
  push:
    branches:
      - main
    paths:
      - 'ios-apps/**/*.swift'
      - 'ios-apps/**/.swiftlint.yml'
  workflow_dispatch:

concurrency:
  group: lint-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  swiftlint:
    name: SwiftLint
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/realm/swiftlint:latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run SwiftLint
        run: |
          cd ios-apps/final-hourglass
          # SwiftLint は Linux 上で lint 完了後 SourceKit 終了待ちでハングする
          # timeout で強制終了し、出力ファイルから結果を判定
          timeout 120 swiftlint lint --reporter github-actions-logging > /tmp/swiftlint_output.txt 2>&1 || true
          cat /tmp/swiftlint_output.txt

          # error 行があれば失敗
          if grep -q "^::error " /tmp/swiftlint_output.txt; then
            echo "::error::SwiftLint errors detected"
            exit 1
          fi
          echo "SwiftLint passed (warnings may exist)"
