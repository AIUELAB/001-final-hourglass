# SwiftLint - 公式 Docker image (SourceKit同梱) で実行
# ubuntu-latest、無料枠消費なし
name: SwiftLint

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'ios-apps/**/*.swift'
      - 'ios-apps/**/.swiftlint.yml'
  push:
    branches:
      - main
    paths:
      - 'ios-apps/**/*.swift'
      - 'ios-apps/**/.swiftlint.yml'
  workflow_dispatch:

concurrency:
  group: lint-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  swiftlint:
    name: SwiftLint
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/realm/swiftlint:latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run SwiftLint
        run: |
          cd ios-apps/final-hourglass
          swiftlint lint --reporter github-actions-logging 2>&1
          echo "SwiftLint completed with exit code $?"
