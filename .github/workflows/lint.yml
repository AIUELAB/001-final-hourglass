# SwiftLint - Docker (SourceKit同梱) で実行（ubuntu-latest、無料枠消費なし）
# スタンドアロンLinuxバイナリはSourceKit欠落でハングするため、
# norio-nomura/action-swiftlint の Docker image を使用
name: SwiftLint

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'ios-apps/**/*.swift'
      - 'ios-apps/**/.swiftlint.yml'
  push:
    branches:
      - main
    paths:
      - 'ios-apps/**/*.swift'
      - 'ios-apps/**/.swiftlint.yml'
  workflow_dispatch:

concurrency:
  group: lint-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  swiftlint:
    name: SwiftLint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run SwiftLint
        uses: norio-nomura/action-swiftlint@3.2.1
        env:
          WORKING_DIRECTORY: ios-apps/final-hourglass
