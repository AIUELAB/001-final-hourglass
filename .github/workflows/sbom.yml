name: SBOM Generation and Vulnerability Scan

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]
  schedule:
    # 毎日UTC 4時に実行（JST 13時）- ci.yml(UTC 3時)との同時実行を回避
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  security-events: write

concurrency:
  group: sbom-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  sbom-syft:
    name: Generate SBOM with Syft
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: sbom-spdx.json

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom-cyclonedx.json

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom-files
          path: |
            sbom-spdx.json
            sbom-cyclonedx.json
          retention-days: 30

      # タグの場合はリリースにSBOMをアップロード
      - name: Upload SBOM to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sbom-spdx.json
            sbom-cyclonedx.json

  vulnerability-scan:
    name: Vulnerability Scan with Grype
    runs-on: ubuntu-latest
    needs: sbom-syft
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download SBOM
        uses: actions/download-artifact@v4
        with:
          name: sbom-files

      - name: Scan for vulnerabilities with Grype
        uses: anchore/scan-action@v3
        id: scan
        with:
          sbom: sbom-spdx.json
          # 脆弱性検出時もレポート生成を継続（結果はSARIFで確認）
          fail-build: false
          severity-cutoff: critical
          output-format: sarif
          output-file: grype-results.sarif

      - name: Upload Grype results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('grype-results.sarif') != ''
        with:
          sarif_file: grype-results.sarif

      - name: Upload Grype report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grype-report
          path: grype-results.sarif
          retention-days: 30

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          # deny-licenses のみ使用（allow-licenses と排他）
          deny-licenses: GPL-3.0, AGPL-3.0
          base-ref: ${{ github.event.pull_request.base.sha }}
          head-ref: ${{ github.event.pull_request.head.sha }}
