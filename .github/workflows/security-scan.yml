name: Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Sunday at 2 AM
    - cron: "0 2 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  dependency-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "claude-code-template-mcp"
          path: "."
          format: "ALL"
          args: >
            --enableRetired
            --enableExperimental
        env:
          JAVA_HOME: /opt/jdk

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: reports/

      - name: Check for vulnerabilities
        # HIGH閾値緩和理由:
        #   - 対象: protobuf等の依存関係脆弱性（Fix版未公開）
        #   - チケット: PR#22（セキュリティCI整備）
        #   - 見直し日: 2026-02-28
        #   - デフォルト10、vars.HIGH_VULN_THRESHOLDで上書き可能
        env:
          HIGH_VULN_THRESHOLD: ${{ vars.HIGH_VULN_THRESHOLD || '10' }}
        run: |
          python -c "
          import json
          import sys
          import os
          from datetime import date

          high_threshold = int(os.environ.get('HIGH_VULN_THRESHOLD', '10'))
          # 閾値緩和の見直し日（監査追跡用）
          review_date = date(2026, 2, 28)
          mitigation_ticket = 'PR#22'

          with open('reports/dependency-check-report.json', 'r') as f:
              report = json.load(f)

          critical = 0
          high = 0

          for dep in report.get('dependencies', []):
              for vuln in dep.get('vulnerabilities', []):
                  severity = vuln.get('severity', '')
                  if severity == 'CRITICAL':
                      critical += 1
                  elif severity == 'HIGH':
                      high += 1

          if critical > 0:
              print(f'❌ Found {critical} CRITICAL vulnerabilities')
              sys.exit(1)
          elif high > high_threshold:
              print(f'⚠️  Found {high} HIGH vulnerabilities (threshold: {high_threshold})')
              sys.exit(1)
          else:
              print(f'✅ Vulnerability check passed (HIGH: {high}/{high_threshold})')
              if high > 5:
                  print(f'📋 Threshold relaxation: {mitigation_ticket}, review by {review_date}')
          "

  pip-audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit
        run: |
          # CVE-2026-0994 除外理由:
          #   - 対象: protobuf json_format.ParseDict() DoS脆弱性
          #   - Fix版: 未公開（protobuf 5.x.x予定）
          #   - 見直し日: 2026-02-28
          pip-audit -r requirements.txt --desc --ignore-vuln CVE-2026-0994

  safety-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install safety
        run: pip install safety

      - name: Run safety check
        run: safety check -r requirements.txt --json
