name: Security Scan (統合版)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 9 * * 1" # 毎週月曜日9時

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # Python Security Scan
  python-security:
    name: Python Security Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit[toml] pip-audit safety

      - name: Run Security Scanners (capture exit codes)
        id: security_scanners
        shell: bash
        run: |
          set +e

          # Bandit
          bandit -c pyproject.toml -r src/ -f json -o bandit-report.json
          echo "bandit_exit_code=$?" >> "$GITHUB_OUTPUT"

          # pip-audit
          pip-audit --desc --format json --output pip-audit-report.json
          echo "pip_audit_exit_code=$?" >> "$GITHUB_OUTPUT"

          # Safety (v3のstdout混入対策)
          safety check --json > safety-report.raw.txt
          echo "safety_exit_code=$?" >> "$GITHUB_OUTPUT"
          python - <<'PY'
          import json
          from pathlib import Path
          raw = Path("safety-report.raw.txt").read_text("utf-8", errors="replace")
          start = raw.find("{")
          end = raw.rfind("}") + 1
          if start >= 0 and end > start:
              Path("safety-report.json").write_text(raw[start:end], encoding="utf-8")
          else:
              Path("safety-report.json").write_text("{}", encoding="utf-8")
          PY

          set -e

      - name: Evaluate security reports
        shell: bash
        env:
          BANDIT_EXIT: ${{ steps.security_scanners.outputs.bandit_exit_code }}
          PIP_AUDIT_EXIT: ${{ steps.security_scanners.outputs.pip_audit_exit_code }}
          SAFETY_EXIT: ${{ steps.security_scanners.outputs.safety_exit_code }}
        run: |
          echo "## Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Scanner | Exit Code |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-----------|" >> $GITHUB_STEP_SUMMARY
          echo "| Bandit | $BANDIT_EXIT |" >> $GITHUB_STEP_SUMMARY
          echo "| pip-audit | $PIP_AUDIT_EXIT |" >> $GITHUB_STEP_SUMMARY
          echo "| Safety | $SAFETY_EXIT |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # JSONレポート存在確認
          for f in bandit-report.json pip-audit-report.json safety-report.json; do
            if [ ! -f "$f" ]; then
              echo "::error::$f が生成されていません"
              exit 1
            fi
          done
          echo "✅ All security reports generated" >> $GITHUB_STEP_SUMMARY

      - name: Upload Security Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            *-report.json
          retention-days: 30

  # Secret Scanning (Gitleaks統合)
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Summary Report
  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [python-security, secret-scan]
    if: always()

    steps:
      - name: Create Summary
        run: |
          echo "## 🔒 Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Python Security | ${{ needs.python-security.result == 'success' && '✅ Pass' || '❌ FAILED' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Secret Scan | ${{ needs.secret-scan.result == 'success' && '✅ Pass' || '❌ FAILED' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ needs.python-security.result }}" != "success" ]] || \
             [[ "${{ needs.secret-scan.result }}" != "success" ]]; then
            echo "⚠️ **WARNING**: Some security checks failed. Review artifacts for details." >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ All security checks passed" >> $GITHUB_STEP_SUMMARY
          fi
