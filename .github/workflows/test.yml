name: Test Pipeline

permissions:
  contents: read

on:
  push:
    branches: [main, develop, feature/*]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11, 3.12]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-asyncio

    - name: Run tests with coverage
      env:
        PYTHONPATH: ${{ github.workspace }}
        CI: true
      run: |
        # CI環境ではCSVファイルに依存するテストを除外
        # これらのテストはローカル環境でのみ実行される
        pytest tests/ \
          --cov=src \
          --cov-report=xml \
          --cov-report=html \
          --cov-report=term \
          --ignore=tests/test_age_focus_gate.py \
          --ignore=tests/test_age_text_consistency.py \
          --ignore=tests/test_auto_loop.py \
          --ignore=tests/test_csv_integrator.py \
          --ignore=tests/test_duplicate_event_detection.py \
          --ignore=tests/test_episode_fame_ranking.py \
          --ignore=tests/test_episode_fame_v6_inversions.py \
          --ignore=tests/test_episode_format_compliance.py \
          --ignore=tests/test_episode_quality_gate.py \
          --ignore=tests/test_episode_score_integrity.py \
          --ignore=tests/test_fame_score_japan.py \
          --ignore=tests/test_fame_score_validation.py \
          --ignore=tests/test_filler_prevention.py \
          --ignore=tests/test_group_name_prevention.py \
          --ignore=tests/test_important_episode_ranking.py \
          --ignore=tests/test_kurosawa_episodes.py \
          --ignore=tests/test_major_award_scoring.py \
          --ignore=tests/test_milestone_consistency.py \
          --ignore=tests/test_oh_sadaharu_episodes.py \
          --ignore=tests/test_persona_context.py \
          --ignore=tests/test_ranking_tuning.py \
          --ignore=tests/test_rikishi_name_validation.py \
          --ignore=tests/test_sage.py \
          --ignore=tests/test_score_tie_resolution.py \
          --ignore=tests/test_turning_point_coverage.py \
          --ignore=tests/test_supabase/ \
          --ignore=tests/test_advanced_predictive_engine.py \
          --ignore=tests/test_auto_updater.py \
          --ignore=tests/test_dashboard_field_sync.py \
          --ignore=tests/test_inventory_manager.py \
          --ignore=tests/test_kpi_definitions.py \
          --ignore=tests/test_kpi_tracker.py \
          --ignore=tests/test_person_growth_idempotency.py \
          --ignore=tests/test_person_growth_integration.py \
          --ignore=tests/test_person_level_consistency.py \
          --ignore=tests/test_person_name_duplicates.py \
          -v

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-${{ matrix.python-version }}

    - name: Archive test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.python-version }}
        path: |
          htmlcov/
          coverage.xml
