# 🎯 6プロジェクト共通 pre-commit 設定
# Phase 7b-3で作成された統一pre-commitテンプレート
# ベース: 001-final-hourglass/.pre-commit-config.yaml
# https://pre-commit.com/

# CI configuration for pre-commit.ci
ci:
  autofix_prs: true
  autoupdate_schedule: weekly
  autoupdate_commit_msg: 'chore: pre-commit autoupdate'
  skip: [mypy, pytest]  # CI環境で時間がかかるものはスキップ

default_stages: [pre-commit]

repos:
  # ============================================
  # Meta hooks (pre-commit自体のチェック)
  # ============================================
- repo: meta
  hooks:
  - id: check-hooks-apply
  - id: check-useless-excludes

  # ============================================
  # 一般的なファイルチェック
  # ============================================
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v4.5.0
  hooks:
      # ファイル形式チェック
  - id: trailing-whitespace
    args: [--markdown-linebreak-ext=md]
  - id: end-of-file-fixer
  - id: check-yaml
    args: [--allow-multiple-documents]
  - id: check-toml
  - id: check-json
  - id: check-xml

      # ファイルサイズ・競合チェック
  - id: check-added-large-files
    args: [--maxkb=1000]
  - id: check-case-conflict
  - id: check-merge-conflict

      # セキュリティチェック
  - id: detect-private-key

      # Pythonチェック
  - id: debug-statements
  - id: check-ast
  - id: check-builtin-literals
  - id: check-docstring-first

      # その他
  - id: mixed-line-ending
    args: [--fix=lf]

  # ============================================
  # Ruff - 統一リンター/フォーマッター
  # ============================================
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.5.7
  hooks:
      # Ruff linter (自動修正付き)
  - id: ruff
    args: [--fix, --exit-non-zero-on-fix]
    files: ^(src/|tests/|scripts/).*\.py$

      # Ruff formatter
  - id: ruff-format
    files: ^(src/|tests/|scripts/).*\.py$

  # ============================================
  # 型チェック (mypy)
  # ============================================
- repo: https://github.com/pre-commit/mirrors-mypy
  rev: v1.11.1
  hooks:
  - id: mypy
    additional_dependencies:
    - types-requests
    - types-pyyaml
    - types-aiofiles
    - pydantic
    args: [--ignore-missing-imports, --check-untyped-defs]
    files: ^src/.*\.py$

  # ============================================
  # セキュリティチェック (Bandit)
  # ============================================
- repo: https://github.com/PyCQA/bandit
  rev: 1.7.9
  hooks:
  - id: bandit
    args: [-ll, -r, src/]
    exclude: tests/

  # ============================================
  # シークレット検出 (Gitleaks)
  # ============================================
- repo: https://github.com/gitleaks/gitleaks
  rev: v8.18.4
  hooks:
  - id: gitleaks

  # ============================================
  # シェルスクリプトチェック
  # ============================================
- repo: https://github.com/shellcheck-py/shellcheck-py
  rev: v0.10.0.1
  hooks:
  - id: shellcheck
    args: [--severity=warning, --shell=bash]
    files: ^scripts/.*\.(sh|bash)$

  # ============================================
  # GitHub Actionsワークフロー検証
  # ============================================
- repo: https://github.com/python-jsonschema/check-jsonschema
  rev: 0.29.1
  hooks:
  - id: check-github-actions
  - id: check-github-workflows

  # ============================================
  # Markdownリンティング
  # ============================================
- repo: https://github.com/igorshubovych/markdownlint-cli
  rev: v0.41.0
  hooks:
  - id: markdownlint
    args: [--fix, --disable, MD013, MD033, MD041]
    files: ^.*\.md$
    exclude: ^(CHANGELOG\.md|node_modules/)

  # ============================================
  # YAML整形
  # ============================================
- repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
  rev: v2.14.0
  hooks:
  - id: pretty-format-yaml
    args: [--autofix, --indent, '2']
    files: ^.*\.(yaml|yml)$
    exclude: ^(.github/workflows/|mcp_unified_config\.yaml)

  # ============================================
  # TOML整形
  # ============================================
- repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
  rev: v2.14.0
  hooks:
  - id: pretty-format-toml
    args: [--autofix]
    files: ^.*\.toml$

# ============================================
# プロジェクト固有の除外設定
# ============================================
# 必要に応じて以下を .pre-commit-config.yaml に追加:
