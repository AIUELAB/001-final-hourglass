# 🎯 6プロジェクト共通 pre-commit 設定
# Phase 7b-3で作成された統一pre-commitテンプレート
# ベース: 001-final-hourglass/.pre-commit-config.yaml
# https://pre-commit.com/

# CI configuration for pre-commit.ci
ci:
  autofix_prs: true
  autoupdate_schedule: weekly
  autoupdate_commit_msg: 'chore: pre-commit autoupdate'
  # CI環境で時間がかかるものやCSVファイル依存のものはスキップ
  skip: [mypy, pytest, check-group-names, check-episode-consistency, check-same-age-duplicates]

default_stages: [pre-commit]

# CI/運用上のノイズを減らすための全体除外
# なぜ:
# - reports/ や output/ は自動生成物が多く、JSON/YAML整形・末尾改行修正で差分が大量発生しやすい
# - CIの pre-commit を「意味のあるソースコード」に集中させるため
exclude: |
  (?x)^(
    reports/|
    output/|
    src/reports/logs/|
    \.serena/|
    \.session/|
    \.sessions/|
    \.scannerwork/|
    coverage\.json$|
    project_memory\.json$|
    mcp_profiles\.json$
  )

repos:
  # ============================================
  # Meta hooks (pre-commit自体のチェック)
  # ============================================
- repo: meta
  hooks:
  - id: check-hooks-apply
  - id: check-useless-excludes

  # ============================================
  # 一般的なファイルチェック
  # ============================================
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v4.5.0
  hooks:
      # ファイル形式チェック
  - id: trailing-whitespace
    args: [--markdown-linebreak-ext=md]
  - id: end-of-file-fixer
  - id: check-yaml
    args: [--allow-multiple-documents, --unsafe]
    exclude: ^(monitoring/|episode_quality_system/docker-compose|docker-compose\..*|mkdocs\.yml)
  - id: check-toml
  - id: check-json
  - id: check-xml

      # ファイルサイズ・競合チェック
  - id: check-added-large-files
    args: [--maxkb=2000]
  - id: check-case-conflict
  - id: check-merge-conflict

      # セキュリティチェック
  - id: detect-private-key

      # Pythonチェック（src/, backend/, scripts/のみ）
  - id: debug-statements
    files: ^(src/|backend/|scripts/).*\.py$
  - id: check-ast
    files: ^(src/|backend/|scripts/).*\.py$
  - id: check-builtin-literals
    files: ^(src/|backend/|scripts/).*\.py$
  - id: check-docstring-first
    files: ^(src/|backend/).*\.py$

      # その他
  - id: mixed-line-ending
    args: [--fix=lf]

  # ============================================
  # Ruff - 統一リンター/フォーマッター
  # ============================================
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.5.7
  hooks:
      # Ruff linter (自動修正付き)
  - id: ruff
    args: [--fix, --exit-non-zero-on-fix]
    files: ^(src/|backend/|tests/|scripts/).*\.py$

      # Ruff formatter
  - id: ruff-format
    files: ^(src/|backend/|tests/|scripts/).*\.py$

  # ============================================
  # 型チェック (mypy)
  # ============================================
- repo: https://github.com/pre-commit/mirrors-mypy
  rev: v1.11.1
  hooks:
  - id: mypy
    additional_dependencies:
    - types-requests
    - types-pyyaml
    - types-aiofiles
    - pydantic
    args: [--ignore-missing-imports, --check-untyped-defs]
    files: ^src/.*\.py$

  # ============================================
  # セキュリティチェック (Bandit)
  # ============================================
- repo: https://github.com/PyCQA/bandit
  rev: 1.7.9
  hooks:
  - id: bandit
    args: [-ll, --skip, B608]  # B608: 内部SQLクエリの誤検出をスキップ
    files: ^(src/|backend/).*\.py$

  # ============================================
  # シークレット検出 (Gitleaks)
  # ============================================
- repo: https://github.com/gitleaks/gitleaks
  rev: v8.18.4
  hooks:
  - id: gitleaks

  # ============================================
  # シェルスクリプトチェック
  # ============================================
- repo: https://github.com/shellcheck-py/shellcheck-py
  rev: v0.10.0.1
  hooks:
  - id: shellcheck
    args: [--severity=error, --shell=bash]
    files: ^scripts/.*\.(sh|bash)$

  # ============================================
  # GitHub Actionsワークフロー検証
  # ============================================
- repo: https://github.com/python-jsonschema/check-jsonschema
  rev: 0.29.1
  hooks:
  - id: check-github-workflows

  # ============================================
  # Markdownリンティング
  # ============================================
- repo: https://github.com/igorshubovych/markdownlint-cli
  rev: v0.41.0
  hooks:
  - id: markdownlint
    args: [--fix, --disable, MD013, MD033, MD041]
    files: ^.*\.md$
    exclude: ^(CHANGELOG\.md|node_modules/)

  # ============================================
  # YAML整形
  # ============================================
- repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
  rev: v2.14.0
  hooks:
  - id: pretty-format-yaml
    args: [--autofix, --indent, '2']
    files: ^.*\.(yaml|yml)$
    exclude: ^(.github/workflows/|mcp_unified_config\.yaml)

  # ============================================
  # TOML整形
  # ============================================
- repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
  rev: v2.14.0
  hooks:
  - id: pretty-format-toml
    args: [--autofix]
    files: ^.*\.toml$

# ============================================
# ローカルフック（iOS品質チェック）
# ============================================
- repo: local
  hooks:
  - id: periphery
    name: Periphery (Dead Code Detection)
    entry: bash -c 'if [ -d "ios-apps/final-hourglass" ]; then cd ios-apps/final-hourglass && periphery scan --project FinalHourglass.xcodeproj --schemes FinalHourglass --quiet 2>/dev/null || echo "⚠️ Periphery not installed (brew install peripheryapp/periphery/periphery)"; fi'
    language: system
    files: ^ios-apps/.*\.swift$
    pass_filenames: false
    stages: [pre-commit]

# ============================================
# ローカルフック（EPUP整合性チェック）
# ============================================
- repo: local
  hooks:
  - id: check-single-master
    name: Check single master CSV
    entry: python scripts/validation/check_single_master.py
    language: python
    additional_dependencies: []
    pass_filenames: false
    always_run: true

  - id: check-single-dashboard
    name: Check single dashboard
    entry: python scripts/validation/check_single_dashboard.py
    language: python
    additional_dependencies: []
    pass_filenames: false
    always_run: true

  - id: check-person-duplicates
    name: Check person name duplicates
    entry: python scripts/validators/person_name_duplicate_validator.py --strict
    language: python
    additional_dependencies: [pandas]
    pass_filenames: false
    files: ^preserved/data/MASTER_EPISODES_CURRENT\.csv$

  - id: check-group-names
    name: Check no group/combo names in person_name
    entry: python scripts/validators/group_name_validator.py --strict
    language: python
    additional_dependencies: [pandas]
    pass_filenames: false
    files: ^preserved/data/MASTER_EPISODES_CURRENT\.csv$

  - id: check-episode-consistency
    name: Check episode text consistency
    entry: python scripts/validators/episode_consistency_checker.py --scan
    language: python
    additional_dependencies: [pandas]
    pass_filenames: false
    files: ^preserved/data/MASTER_EPISODES_CURRENT\.csv$

  - id: check-polite-form
    name: Check polite form compliance (≤3%)
    entry: python scripts/validation/quality_regression_check.py --check polite --threshold 3.0
    language: python
    additional_dependencies: [pandas]
    pass_filenames: false
    files: ^preserved/data/MASTER_EPISODES_CURRENT\.csv$

  - id: check-watashi-pattern
    name: Check watashi pattern (0 violations)
    entry: python scripts/validation/quality_regression_check.py --check watashi
    language: python
    additional_dependencies: [pandas]
    pass_filenames: false
    files: ^preserved/data/MASTER_EPISODES_CURRENT\.csv$

  - id: check-meta-violations
    name: Check meta element violations in fictional episodes
    entry: python scripts/validation/detect_meta_element_violations.py --dry-run --strict
    language: python
    pass_filenames: false
    files: ^preserved/data/MASTER_EPISODES_CURRENT\.csv$
    additional_dependencies: [pandas]

  - id: check-fictional-name-format
    name: Check fictional character name format violations
    entry: python scripts/validation/detect_fictional_name_violations.py --dry-run --output /dev/null
    language: python
    pass_filenames: false
    files: ^preserved/data/MASTER_EPISODES_CURRENT\.csv$
    additional_dependencies: [pandas]

  - id: check-person-type-mismatch
    name: Check person_type misclassification (REAL→FICTIONAL)
    entry: python scripts/validation/detect_person_type_mismatch.py
    language: python
    pass_filenames: false
    files: ^preserved/data/MASTER_EPISODES_CURRENT\.csv$
    additional_dependencies: [pandas]

  - id: check-same-age-duplicates
    name: Check same age duplicate episodes (EPUP rule)
    entry: python scripts/validation/same_age_duplicate_gate.py
    language: python
    pass_filenames: false
    files: ^preserved/data/MASTER_EPISODES_CURRENT\.csv$
    additional_dependencies: [pandas]

# ============================================
# プロジェクト固有の除外設定
# ============================================
# 必要に応じて以下を .pre-commit-config.yaml に追加:
