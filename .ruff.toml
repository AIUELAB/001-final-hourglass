# Ruff configuration

extend-exclude = ["archive", "_archived"]
line-length = 120
target-version = "py311"

[format]
indent-style = "space"
quote-style = "double"

[lint]
# Pythonファイルのみをチェック対象とする
exclude = [
  "*.csv",
  "*.json",
  "*.md",
  "*.txt",
  "*.html",
  "archive/",
  "archive_json/",
  "_archived/",
  "venv/",
  "__pycache__/",
  ".git/",
  "ios-apps/",
  "docs/",
  "templates/",
  "automation/"
]
# 無視するエラー
ignore = [
  "E402",  # module level import not at top of file (sys.path manipulation)
  "E501",  # line too long (handled by formatter)
  "E741",  # ambiguous variable name
  # TODO: 以下は段階的に有効化予定
  # 現在 F401: ~20件、F841: ~30件の違反あり
  "F401",  # imported but unused
  "F821",  # undefined name (dynamic imports in scripts)
  "F841",  # local variable assigned but never used
  "I001"  # import sorting (causes conflicts between local and CI ruff versions)
]
# エラーの選択
select = [
  "E",  # pycodestyle errors
  "F",  # pyflakes
  "I"  # isort
]
