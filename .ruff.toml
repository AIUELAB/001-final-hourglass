# Ruff configuration

line-length = 120
target-version = "py311"

[format]
indent-style = "space"
quote-style = "double"

[lint]
# Pythonファイルのみをチェック対象とする
exclude = [
  "*.csv",
  "*.json",
  "*.md",
  "*.txt",
  "*.html",
  "archive_json/",
  "venv/",
  "__pycache__/",
  ".git/",
  "ios-apps/",
  "docs/",
  "templates/",
  "automation/"
]
# 無視するエラー
ignore = [
  "E402",  # module level import not at top of file (sys.path manipulation)
  "E501",  # line too long (handled by formatter)
  "E741",  # ambiguous variable name
  "F401",  # imported but unused
  "F821",  # undefined name (dynamic imports in scripts)
  "F841"  # local variable assigned but never used
]
# エラーの選択
select = [
  "E",  # pycodestyle errors
  "F",  # pyflakes
  "I"  # isort
]
