disabled_rules:
  - multiple_closures_with_trailing_closure
  - redundant_string_enum_value

opt_in_rules:
  - line_length
  - identifier_name
  - file_length
  - function_body_length
  - cyclomatic_complexity
  - type_body_length

excluded:
  - ios-apps/final-hourglass/FinalHourglass/Views/LifeResult/Backups
  - ios-apps/final-hourglass/FinalHourglass/Views/Profile/ProfileView_buckup.swift
  - ios-apps/final-hourglass/FinalHourglass/Views/Onboarding/OnboardingView_backup.swift
  - ios-apps/development-system

line_length:
  warning: 120
  error: 200
  ignores_comments: true

file_length:
  warning: 1200
  error: 2500

type_body_length:
  warning: 650
  error: 800

identifier_name:
  excluded: [xs, sm, md, lg, xl]
  min_length:
    warning: 3
    error: 2

reporter: "xcode"
