# センシティブキーワード設定
# PERSON成長パイプラインで使用するセンシティブ候補のフィルタリング設定

# 自動ブロック対象（--allow-sensitiveなしでは追加不可）
sensitive_categories:
- 犯罪者
- テロリスト
- 戦争犯罪
- 暴力団
- 麻薬密売

# 自動ブロック対象キーワード（descriptionに含まれる場合）
sensitive_keywords:
- 死刑
- 懲役
- 逮捕
- 起訴
- 有罪
- 殺人
- 強盗
- テロ
- 暴力団
- 麻薬
- 詐欺
- 横領

# レビュー必要カテゴリ（警告のみ、自動ブロックしない）
review_required_categories:
- 政治家      # 政治的中立性チェック
- 宗教家      # 宗教的中立性チェック
- 実業家      # ビジネス倫理チェック

# 許可リスト（センシティブキーワードを含むが正当な人物）
# 例: "逮捕された人物"でも歴史上重要な人物は追加可能
allow_list:
- ネルソン・マンデラ      # 逮捕歴があるが政治的活動
- マハトマ・ガンジー      # 逮捕歴があるが非暴力運動
- マーティン・ルーサー・キング・ジュニア      # 逮捕歴があるが公民権運動
