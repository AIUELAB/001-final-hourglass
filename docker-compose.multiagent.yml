version: '3.8'

services:
  # メインオーケストレータ
  quality-orchestrator:
    build:
      context: .
      dockerfile: Dockerfile.multiagent
    container_name: quality-orchestrator
    environment:
      - SERVICE_NAME=orchestrator
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://postgres:${DB_PASSWORD:-password}@postgres:5432/quality
      - CODEX_SERVER_URL=http://codex-server:8001
      - PROMETHEUS_ENABLED=true
      - ML_AUTO_RETRAIN=true
      - ML_RETRAIN_INTERVAL=3600
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./models:/app/models
      - quality-cache:/app/.cache
    ports:
      - "8002:8002"  # Orchestrator API
      - "9090:9090"  # Prometheus metrics
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - quality-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 512M
          cpus: '0.5'

  # Codex MCPサーバー
  codex-server:
    build:
      context: .
      dockerfile: Dockerfile.multiagent
    container_name: codex-server
    command: python codex_mcp_server.py
    environment:
      - SERVICE_NAME=codex
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - CACHE_ENABLED=true
      - MAX_WORKERS=10
    ports:
      - "8001:8001"
    networks:
      - quality-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Redis キャッシュ・セッション管理
  redis:
    image: redis:7-alpine
    container_name: quality-redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - quality-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # PostgreSQL メトリクス・学習データ
  postgres:
    image: postgres:15-alpine
    container_name: quality-postgres
    environment:
      - POSTGRES_DB=quality
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD:-password}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - quality-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # 監視ダッシュボード
  nginx:
    image: nginx:alpine
    container_name: quality-dashboard
    volumes:
      - ./monitoring/dashboard.html:/usr/share/nginx/html/index.html:ro
      - ./monitoring/static:/usr/share/nginx/html/static:ro
    ports:
      - "80:80"
    networks:
      - quality-network
    restart: unless-stopped
    depends_on:
      - quality-orchestrator
      - codex-server

  # Prometheus メトリクス収集
  prometheus:
    image: prom/prometheus:latest
    container_name: quality-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9091:9090"
    networks:
      - quality-network
    restart: unless-stopped

  # Grafana 可視化
  grafana:
    image: grafana/grafana:latest
    container_name: quality-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=redis-datasource
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    networks:
      - quality-network
    restart: unless-stopped
    depends_on:
      - prometheus

networks:
  quality-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  redis-data:
    driver: local
  postgres-data:
    driver: local
  quality-cache:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local