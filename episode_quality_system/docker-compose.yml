version: '3.8'

services:
  episode-factory:
    build:
      context: .
      dockerfile: Dockerfile
    image: episode-factory:v2.0.0
    container_name: episode-factory-prod
    restart: unless-stopped
    ports:
      - "8000:8000"  # ヘルスチェック
      - "9090:9090"  # メトリクス
    volumes:
      - ./logs:/logs
      - ./data:/data
      - type: bind
        source: ./complete_person_facts.json
        target: /app/complete_person_facts.json
        read_only: true
    environment:
      - EPISODE_FACTORY_ENV=production
      - VALIDATION_MODE=optimized
      - MIN_QUALITY_SCORE=70.0
      - MAX_ATTEMPTS=5
      - USE_CACHE=true
      - LOG_LEVEL=INFO
      - LOG_FILE=/logs/episode_factory.log
      - METRICS_ENABLED=true
      - METRICS_PORT=9090
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - episode-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    labels:
      - "com.episode-factory.version=2.0.0"
      - "com.episode-factory.service=main"
      - "prometheus.io/scrape=true"
      - "prometheus.io/port=9090"

  # Nginx リバースプロキシ
  nginx:
    image: nginx:alpine
    container_name: episode-factory-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - episode-factory
    networks:
      - episode-network
    labels:
      - "com.episode-factory.service=proxy"

  # Prometheus モニタリング
  prometheus:
    image: prom/prometheus:latest
    container_name: episode-factory-prometheus
    restart: unless-stopped
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - episode-network
    labels:
      - "com.episode-factory.service=monitoring"

  # Grafana ダッシュボード
  grafana:
    image: grafana/grafana:latest
    container_name: episode-factory-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=episode123
      - GF_INSTALL_PLUGINS=
    depends_on:
      - prometheus
    networks:
      - episode-network
    labels:
      - "com.episode-factory.service=dashboard"

  # Redis キャッシュ
  redis:
    image: redis:7-alpine
    container_name: episode-factory-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - episode-network
    labels:
      - "com.episode-factory.service=cache"

networks:
  episode-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  prometheus-data:
  grafana-data:
  redis-data: