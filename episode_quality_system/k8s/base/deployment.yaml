apiVersion: apps/v1
kind: Deployment
metadata:
  name: episode-factory
  labels:
    app: episode-factory
    version: v2.0.0
    component: backend
spec:
  replicas: 3
  revisionHistoryLimit: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: episode-factory
  template:
    metadata:
      labels:
        app: episode-factory
        version: v2.0.0
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '9090'
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: episode-factory
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: episode-factory
        image: ghcr.io/your-org/episode-factory:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP
        env:
        - name: EPISODE_FACTORY_ENV
          valueFrom:
            configMapKeyRef:
              name: episode-factory-config
              key: environment
        - name: VALIDATION_MODE
          valueFrom:
            configMapKeyRef:
              name: episode-factory-config
              key: validation_mode
        - name: MIN_QUALITY_SCORE
          valueFrom:
            configMapKeyRef:
              name: episode-factory-config
              key: min_quality_score
        - name: MAX_ATTEMPTS
          valueFrom:
            configMapKeyRef:
              name: episode-factory-config
              key: max_attempts
        - name: USE_CACHE
          valueFrom:
            configMapKeyRef:
              name: episode-factory-config
              key: use_cache
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: episode-factory-config
              key: log_level
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: episode-factory-secrets
              key: api_key
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /live
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 0
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
        volumeMounts:
        - name: data
          mountPath: /data
        - name: logs
          mountPath: /logs
        - name: person-facts
          mountPath: /app/complete_person_facts.json
          subPath: complete_person_facts.json
          readOnly: true
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      volumes:
      - name: data
        emptyDir: {}
      - name: logs
        emptyDir: {}
      - name: person-facts
        configMap:
          name: person-facts-data
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - episode-factory
              topologyKey: kubernetes.io/hostname
