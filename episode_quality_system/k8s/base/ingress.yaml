apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: episode-factory-ingress
  labels:
    app: episode-factory
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/rate-limit: "1000"
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Content-Type, Authorization, X-API-Key"
spec:
  tls:
  - hosts:
    - episode-factory.example.com
    - api.episode-factory.example.com
    secretName: episode-factory-tls
  rules:
  - host: episode-factory.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: episode-factory
            port:
              number: 80
  - host: api.episode-factory.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: episode-factory
            port:
              number: 80