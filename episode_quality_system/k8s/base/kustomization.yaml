apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: episode-factory

commonLabels:
  app: episode-factory
  managed-by: kustomize
  version: v2.0.0

resources:
  - deployment.yaml
  - service.yaml
  - configmap.yaml
  - hpa.yaml
  - ingress.yaml
  - rbac.yaml
  - pdb.yaml
  - networkpolicy.yaml

images:
  - name: ghcr.io/your-org/episode-factory
    newTag: latest

replicas:
  - name: episode-factory
    count: 3

configMapGenerator:
  - name: person-facts-data
    files:
      - complete_person_facts.json=../../complete_person_facts.json

secretGenerator:
  - name: episode-factory-secrets
    literals:
      - api_key=CHANGE_ME_IN_PRODUCTION
    type: Opaque