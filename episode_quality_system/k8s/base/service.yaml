---
apiVersion: v1
kind: Service
metadata:
  name: episode-factory
  labels:
    app: episode-factory
    component: backend
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: http
spec:
  type: ClusterIP
  selector:
    app: episode-factory
  ports:
  - name: http
    port: 80
    targetPort: 8000
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: 9090
    protocol: TCP
  sessionAffinity: None

---
apiVersion: v1
kind: Service
metadata:
  name: episode-factory-nodeport
  labels:
    app: episode-factory
    component: backend
spec:
  type: NodePort
  selector:
    app: episode-factory
  ports:
  - name: http
    port: 80
    targetPort: 8000
    nodePort: 30080
    protocol: TCP
