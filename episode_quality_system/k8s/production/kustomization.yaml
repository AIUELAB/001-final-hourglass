apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: production

namePrefix: prod-

commonLabels:
  environment: production

bases:
  - ../base

patchesStrategicMerge:
  - deployment-patch.yaml

configMapGenerator:
  - name: episode-factory-config
    behavior: merge
    literals:
      - environment=production
      - log_level=INFO
      - min_quality_score=70.0
      - max_attempts=5

secretGenerator:
  - name: episode-factory-secrets
    behavior: replace
    envs:
      - secrets.env

replicas:
  - name: episode-factory
    count: 5

images:
  - name: ghcr.io/your-org/episode-factory
    newTag: v2.0.0