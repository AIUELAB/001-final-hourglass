apiVersion: apps/v1
kind: Deployment
metadata:
  name: episode-factory
spec:
  replicas: 2
  template:
    spec:
      containers:
      - name: episode-factory
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
        env:
        - name: EPISODE_FACTORY_ENV
          value: staging
        - name: LOG_LEVEL
          value: DEBUG
        - name: ENABLE_PROFILING
          value: 'true'
        - name: RATE_LIMIT_PER_MINUTE
          value: '100'
