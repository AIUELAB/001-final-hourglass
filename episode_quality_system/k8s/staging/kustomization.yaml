apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: staging

namePrefix: staging-

commonLabels:
  environment: staging

bases:
- ../base

patchesStrategicMerge:
- deployment-patch.yaml

configMapGenerator:
- name: episode-factory-config
  behavior: merge
  literals:
  - environment=staging
  - log_level=DEBUG
  - min_quality_score=60.0
  - max_attempts=10

replicas:
- name: episode-factory
  count: 2

images:
- name: ghcr.io/your-org/episode-factory
  newTag: develop
