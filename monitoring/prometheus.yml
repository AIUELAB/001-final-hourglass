# Prometheus Configuration for Multi-Agent Quality System
# Phase 4 - Production Monitoring

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'quality-system'
    environment: 'production'

# Alert Manager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: []
          # - 'alertmanager:9093'

# Load rules once and periodically evaluate them
rule_files:
  - '/etc/prometheus/rules/*.yml'

# Scrape configurations
scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'

  # Quality Orchestrator metrics
  - job_name: 'orchestrator'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['quality-orchestrator:9090']
        labels:
          service: 'orchestrator'
          component: 'main'

  # Codex Server metrics
  - job_name: 'codex'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['codex-server:9090']
        labels:
          service: 'codex'
          component: 'mcp'

  # Redis exporter
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
        labels:
          service: 'redis'
          component: 'cache'

  # PostgreSQL exporter
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']
        labels:
          service: 'postgres'
          component: 'database'

  # Node exporter for system metrics
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: 'node'
          component: 'system'