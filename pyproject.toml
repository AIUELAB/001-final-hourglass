[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=69.0.0", "wheel"]

[project]
authors = [
  {name = "Claude Code Team", email = "claude@anthropic.com"}
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
  # Core dependencies
  "requests==2.32.3",
  "pydantic==2.8.2",
  "click==8.1.7",
  "rich==13.7.1",
  "python-dotenv==1.0.1",
  # Async support
  "aiohttp==3.10.2",
  "aiofiles==23.2.1",
  "websockets==12.0",
  # JSON/YAML
  "pyyaml==6.0.1",
  "jsonschema==4.22.0",
  # API clients
  "httpx==0.27.0",
  # Logging
  "loguru==0.7.2",
  # MCP Integration
  "mcp-use==1.3.9",
  "langchain-openai==0.3.0",
  "langchain-anthropic==0.3.0",
  # Performance monitoring
  "psutil==5.9.0",
  # Supabase Integration
  "supabase>=2.0.0",
  "tenacity>=8.0.0"
]
description = "2025年最新ベストプラクティス対応のClaude Code MCPテンプレート"
keywords = ["mcp", "claude", "ai", "development", "automation"]
name = "claude-code-template-mcp"
readme = "README.md"
requires-python = ">=3.11"
version = "2.0.0"

[project.optional-dependencies]
all = [
  # Includes all optional dependencies
  # Ollama packages
  "ollama==0.1.7",
  "langchain-ollama==0.1.0",
  "llama-index-llms-ollama==0.1.0",
  # Testing
  "pytest==8.3.2",
  "pytest-cov==5.0.0",
  "pytest-mock==3.14.0",
  "pytest-asyncio==0.23.7",
  "aioresponses==0.7.6",
  "ruff==0.5.7",
  "mypy==1.11.1",
  "pyright==1.1.350",
  "bandit==1.7.9",
  "pip-audit==2.7.3",
  "semgrep==1.45.0",
  "safety==3.0.0",
  "pre-commit==3.8.0",
  "radon==6.0.1",
  "types-requests==2.32.0.20240712",
  "types-aiofiles==23.2.0.0",
  "mkdocs==1.5.3",
  "mkdocs-material==9.5.0",
  "mkdocstrings[python]==0.24.0",
  "mkdocs-gen-files==0.5.0",
  "mkdocs-literate-nav==0.6.1",
  "mkdocs-section-index==0.3.8"
]
dev = [
  # Testing
  "pytest==8.3.2",
  "pytest-cov==5.0.0",
  "pytest-mock==3.14.0",
  "pytest-asyncio==0.23.7",
  "aioresponses==0.7.6",
  # Code quality (Ruff統一)
  "ruff==0.5.7",
  "mypy==1.11.1",
  # Type checking
  "pyright==1.1.350",
  # Security
  "bandit==1.7.9",
  "pip-audit==2.7.3",
  "semgrep==1.45.0",
  # Pre-commit
  "pre-commit==3.8.0",
  # Code metrics
  "radon==6.0.1",
  # Type stubs
  "types-requests==2.32.0.20240712",
  "types-aiofiles==23.2.0.0"
]
docs = [
  # Documentation
  "mkdocs==1.5.3",
  "mkdocs-material==9.5.0",
  "mkdocstrings[python]==0.24.0",
  "mkdocs-gen-files==0.5.0",
  "mkdocs-literate-nav==0.6.1",
  "mkdocs-section-index==0.3.8"
]
ollama = [
  # Ollama Integration (ローカルLLM)
  "ollama==0.1.7",
  "langchain-ollama==0.1.0",
  "llama-index-llms-ollama==0.1.0"
]
security = [
  "bandit==1.7.9",
  "pip-audit==2.7.3",
  "semgrep==1.45.0",
  "safety==3.0.0"
]
test = [
  "pytest==8.3.2",
  "pytest-cov==5.0.0",
  "pytest-mock==3.14.0",
  "pytest-asyncio==0.23.7",
  "aioresponses==0.7.6"
]

[project.scripts]
claude-mcp = "src.main:main"

[tool.bandit]
exclude_dirs = ["tests", "venv", ".venv"]
skips = [
  "B101",  # assert_used (テスト用)
  "B404",  # subprocess import (使用自体は問題ない)
  "B403",  # pickle import (sklearn標準用途)
  "B311",  # random (非セキュリティ用途)
  "B607",  # partial path (システムコマンドの安全な使用)
  "B603",  # subprocess without shell=True (安全な使用方法)
  "B112"  # try-except-continue (設計上許容)
]
targets = ["src"]

[tool.basedpyright]
exclude = ["venv", ".venv", "node_modules", ".git", "cache", "ide_cache_env", "versions", "deletion_results", "deletion_backups", "test_deletion_results_*", "test_output"]
include = ["."]
pythonVersion = "3.11"
reportAny = false
reportUnusedImport = false
typeCheckingMode = "all"

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise AssertionError",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:"
]
show_missing = true
skip_covered = true

[tool.coverage.run]
branch = true
omit = ["*/tests/*", "*/test_*.py"]
source = ["src"]

[tool.mypy]
check_untyped_defs = true
exclude = [
  "^claude-code-template-mcp/",
  "^[^/]+\\.py$"
]
ignore_missing_imports = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]
pretty = true
python_version = "3.11"
strict_optional = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
ignore_errors = true
module = [
  "src.advanced_trend_dashboard",
  "src.ai_recommendation_system",
  "src.auto_updater",
  "src.auto_updater_fixed",
  "src.beartype_integration",
  "src.cache_manager",
  "src.capacity_planning_automation",
  "src.cost_optimization_algorithm",
  "src.error_recovery",
  "src.fact_checker",
  "src.headless_mode",
  "src.integrity_checker",
  "src.mcp_examples",
  "src.notification_integration",
  "src.notification_system",
  "src.ollama_integration",
  "src.performance_optimizer",
  "src.playwright_mcp_examples",
  "src.remote_mcp_integration",
  "src.secure_config",
  "src.superclaude_learning",
  "src.superclaude_project_config",
  "src.sync_projects.service",
  "src.version_controller"
]

[tool.pyright]
exclude = ["venv", ".venv", "node_modules", ".git", "cache", "ide_cache_env", "versions", "deletion_results", "deletion_backups", "test_deletion_results_*", "test_output"]
include = ["."]
pythonVersion = "3.11"
reportGeneralTypeIssues = true
reportMissingImports = false
reportMissingTypeStubs = false
reportPrivateUsage = true
reportUnknownArgumentType = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnnecessaryCast = true
reportUnnecessaryComparison = true
reportUnnecessaryIsInstance = true
reportUnusedImport = false
stubPath = "typings"
typeCheckingMode = "strict"

[tool.pytest]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --tb=short --cov=src --cov-report=term-missing:skip-covered"
filterwarnings = [
  "ignore:coroutine.*was never awaited:RuntimeWarning",
  "ignore::pytest.PytestUnraisableExceptionWarning"
]
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "integration: marks tests as integration tests",
  "unit: marks tests as unit tests",
  "asyncio: marks tests as async (used by pytest-asyncio)"
]
minversion = "8.0"
norecursedirs = ["_archived", ".git", "__pycache__", "*.egg-info"]
pythonpath = ["src"]
testpaths = ["tests"]

# Ruff設定: .ruff.tomlが優先されます
# 詳細設定は .ruff.toml を参照してください
[tool.ruff]

[tool.semgrep]
config = [
  "auto",
  "https://semgrep.dev/p/python",
  "https://semgrep.dev/p/security-audit",
  "https://semgrep.dev/p/owasp-top-ten"
]
exclude = ["tests/", "venv/", ".venv/"]
paths = ["src/"]

# uv specific configuration
[tool.uv]
dev-dependencies = [
  "ipython>=8.26.0",
  "ipdb>=0.13.13"
]
managed = true

[tool.uv.pip]
compile = true
extra-index-url = []
index-url = "https://pypi.org/simple"
system = false
