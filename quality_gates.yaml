# =============================================================================
# ダミーデータ検出パターン
# =============================================================================
dummy_data_patterns:
  keywords:
    - "TODO"
    - "FIXME"
    - "HACK"
    - "XXX"
    - "シミュレート"
    - "simulated"
    - "placeholder"
    - "dummy"
    - "mock"
    - "fake"
    - "test"
    
  values:
    - total_results: 0
    - results: []
    - data: null
    - score: 0.0
    - source: "fallback"
    - source: "default"
    
  patterns:
    - regex: "return\\s+0"
    - regex: "return\\s+\\[\\]"
    - regex: "return\\s+\\{\\}"
    - regex: "return\\s+None"
    - regex: "raise\\s+NotImplementedError"

# =============================================================================
# エラー処理設定
# =============================================================================
error_handling:
  fail_fast_enabled: true
  rollback_on_error: true
  preserve_audit_trail: true
  notify_on_failure: true
  
  actions:
    STOP:
      description: "即座に処理を停止"
      rollback: true
      notify: true
      
    WARNING:
      description: "警告を出力して続行"
      rollback: false
      notify: true
      
    RETRY:
      description: "再試行"
      max_retries: 3
      retry_delay: 5  # seconds
      
    SKIP:
      description: "該当データをスキップ"
      log_skipped: true

# =============================================================================
# 監査設定
# =============================================================================
audit:
  enabled: true
  log_all_decisions: true
  log_all_api_calls: true
  log_quality_checks: true
  
  export:
    format: "json"
    include_timestamps: true
    include_stack_traces: true
    max_size_mb: 100
    
  retention:
    days: 90
    compress_after_days: 7