<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>リアルタイム誕生年取得ダッシュボード</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            position: relative;
        }

        .connection-status {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
        }

        .connected {
            background: #10b981;
            color: white;
        }

        .disconnected {
            background: #ef4444;
            color: white;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        h1 {
            font-size: 2.5em;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 1.2em;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 50px rgba(0,0,0,0.15);
        }

        .stat-label {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-value {
            font-size: 2.5em;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
            transition: color 0.3s;
        }

        .stat-value.updating {
            color: #667eea;
            animation: flash 0.5s;
        }

        @keyframes flash {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .stat-detail {
            color: #999;
            font-size: 0.9em;
        }

        .progress-section {
            background: white;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

        .progress-bar-container {
            background: #f3f4f6;
            border-radius: 10px;
            padding: 5px;
            margin: 20px 0;
            position: relative;
            height: 40px;
        }

        .progress-bar {
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            height: 30px;
            border-radius: 5px;
            transition: width 0.5s ease-in-out;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            position: relative;
            overflow: hidden;
        }

        .progress-bar::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        .log-section {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            max-height: 600px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .log-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .log-container {
            background: #f9fafb;
            border-radius: 10px;
            padding: 20px;
            overflow-y: auto;
            flex: 1;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.6;
        }

        .log-entry {
            padding: 8px 12px;
            margin-bottom: 5px;
            border-radius: 5px;
            animation: slideIn 0.3s ease-out;
            transition: background-color 0.3s;
        }

        @keyframes slideIn {
            from {
                transform: translateX(-20px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .log-entry.success {
            background: #d1fae5;
            color: #065f46;
            border-left: 4px solid #10b981;
        }

        .log-entry.failed {
            background: #fee2e2;
            color: #991b1b;
            border-left: 4px solid #ef4444;
        }

        .log-entry.info {
            background: #dbeafe;
            color: #1e40af;
            border-left: 4px solid #3b82f6;
        }

        .log-entry.new {
            animation: highlight 1s ease-out;
        }

        @keyframes highlight {
            0% {
                background: #fef3c7;
                transform: scale(1.02);
            }
            100% {
                transform: scale(1);
            }
        }

        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: bold;
            text-transform: uppercase;
        }

        .status-idle {
            background: #e5e7eb;
            color: #6b7280;
        }

        .status-running {
            background: #fef3c7;
            color: #92400e;
            animation: blink 2s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .status-completed {
            background: #d1fae5;
            color: #065f46;
        }

        .status-error {
            background: #fee2e2;
            color: #991b1b;
        }

        .eta-display {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 15px;
            padding: 15px;
            background: #f9fafb;
            border-radius: 10px;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid #e5e7eb;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .control-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        .control-button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .control-button.start {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .control-button.stop {
            background: #ef4444;
            color: white;
        }

        .control-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }

        .control-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .update-indicator {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #10b981;
            color: white;
            padding: 12px 20px;
            border-radius: 30px;
            font-weight: bold;
            display: none;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from {
                transform: translateY(50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .update-indicator.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="connection-status disconnected" id="connectionStatus">
                ⚡ 未接続
            </div>
            <h1>🎯 誕生年取得ダッシュボード</h1>
            <p class="subtitle">リアルタイム進捗モニタリング</p>
        </div>

        <div class="control-buttons">
            <button class="control-button start" onclick="startProcess('auto')">
                ▶️ 処理開始
            </button>
            <button class="control-button stop" onclick="stopProcess()">
                ⏹️ 停止
            </button>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">ステータス</div>
                <div class="stat-value">
                    <span class="status-badge status-idle" id="statusBadge">待機中</span>
                </div>
                <div class="stat-detail" id="currentFile">-</div>
            </div>

            <div class="stat-card">
                <div class="stat-label">進捗</div>
                <div class="stat-value" id="progressValue">0 / 0</div>
                <div class="stat-detail" id="progressPercent">0%</div>
            </div>

            <div class="stat-card">
                <div class="stat-label">取得成功</div>
                <div class="stat-value" id="foundValue">0</div>
                <div class="stat-detail" id="successRate">成功率: 0%</div>
            </div>

            <div class="stat-card">
                <div class="stat-label">処理速度</div>
                <div class="stat-value" id="speedValue">0</div>
                <div class="stat-detail">件/分</div>
            </div>
        </div>

        <div class="progress-section">
            <h2>📊 全体進捗</h2>
            <div class="progress-bar-container">
                <div class="progress-bar" id="progressBar" style="width: 0%">
                    <span id="progressBarText">0%</span>
                </div>
            </div>
            <div class="eta-display">
                <div class="spinner" id="spinner" style="display: none;"></div>
                <div id="etaText">処理待機中...</div>
                <div style="margin-left: auto;" id="lastUpdate">最終更新: -</div>
            </div>
        </div>

        <div class="log-section">
            <div class="log-header">
                <h2>📝 最新ログ</h2>
                <button onclick="clearLogs()" style="padding: 5px 10px; border: 1px solid #ccc; border-radius: 5px; cursor: pointer;">クリア</button>
            </div>
            <div class="log-container" id="logContainer">
                <div class="log-entry info">システム起動中...</div>
            </div>
        </div>
    </div>

    <div class="update-indicator" id="updateIndicator">
        ✨ データ更新
    </div>

    <script>
        // WebSocket接続
        const socket = io('http://localhost:5002');
        let isConnected = false;
        let lastUpdateTime = null;

        // DOM要素
        const elements = {
            connectionStatus: document.getElementById('connectionStatus'),
            statusBadge: document.getElementById('statusBadge'),
            currentFile: document.getElementById('currentFile'),
            progressValue: document.getElementById('progressValue'),
            progressPercent: document.getElementById('progressPercent'),
            foundValue: document.getElementById('foundValue'),
            successRate: document.getElementById('successRate'),
            speedValue: document.getElementById('speedValue'),
            progressBar: document.getElementById('progressBar'),
            progressBarText: document.getElementById('progressBarText'),
            etaText: document.getElementById('etaText'),
            spinner: document.getElementById('spinner'),
            logContainer: document.getElementById('logContainer'),
            updateIndicator: document.getElementById('updateIndicator'),
            lastUpdate: document.getElementById('lastUpdate')
        };

        // WebSocketイベント
        socket.on('connect', () => {
            console.log('WebSocket接続成功');
            isConnected = true;
            elements.connectionStatus.className = 'connection-status connected';
            elements.connectionStatus.textContent = '⚡ 接続中';
            addLog('システムに接続しました', 'info');
        });

        socket.on('disconnect', () => {
            console.log('WebSocket切断');
            isConnected = false;
            elements.connectionStatus.className = 'connection-status disconnected';
            elements.connectionStatus.textContent = '⚡ 切断';
            addLog('接続が切断されました', 'error');
        });

        socket.on('progress_update', (data) => {
            console.log('進捗更新:', data);
            updateDashboard(data);
            showUpdateIndicator();
        });

        socket.on('status_changed', (data) => {
            console.log('ステータス変更:', data);
            addLog(`ステータス: ${data.status}`, 'info');
        });

        // ダッシュボード更新
        function updateDashboard(data) {
            // ステータス更新
            updateStatus(data.status);

            // 現在のファイル
            if (data.current_file) {
                elements.currentFile.textContent = data.current_file;
            }

            // 進捗更新（アニメーション付き）
            const oldCompleted = parseInt(elements.progressValue.textContent.split(' / ')[0]) || 0;
            if (data.completed !== oldCompleted) {
                elements.progressValue.classList.add('updating');
                setTimeout(() => elements.progressValue.classList.remove('updating'), 500);
            }

            elements.progressValue.textContent = `${data.completed || 0} / ${data.total_records || 0}`;
            const percentage = data.total_records > 0
                ? ((data.completed || 0) / data.total_records * 100).toFixed(1)
                : 0;
            elements.progressPercent.textContent = `${percentage}%`;

            // プログレスバー更新
            elements.progressBar.style.width = `${percentage}%`;
            elements.progressBarText.textContent = `${percentage}%`;

            // 取得成功数更新
            const oldFound = parseInt(elements.foundValue.textContent) || 0;
            if (data.found !== oldFound) {
                elements.foundValue.classList.add('updating');
                setTimeout(() => elements.foundValue.classList.remove('updating'), 500);
            }
            elements.foundValue.textContent = data.found || 0;
            elements.successRate.textContent = `成功率: ${(data.success_rate || 0).toFixed(1)}%`;

            // 処理速度
            elements.speedValue.textContent = (data.speed || 0).toFixed(1);

            // ETA更新
            if (data.status === 'running') {
                elements.spinner.style.display = 'block';
                if (data.eta_minutes) {
                    const minutes = Math.ceil(data.eta_minutes);
                    if (minutes > 60) {
                        const hours = Math.floor(minutes / 60);
                        const mins = minutes % 60;
                        elements.etaText.textContent = `残り時間: 約${hours}時間${mins}分`;
                    } else {
                        elements.etaText.textContent = `残り時間: 約${minutes}分`;
                    }
                } else {
                    elements.etaText.textContent = '処理中...';
                }
            } else {
                elements.spinner.style.display = 'none';
                elements.etaText.textContent = data.status === 'completed' ? '処理完了！' : '処理待機中...';
            }

            // 最新ログ更新
            if (data.recent_logs && Array.isArray(data.recent_logs)) {
                updateLogs(data.recent_logs);
            }

            // 最終更新時刻
            if (data.last_update) {
                const updateTime = new Date(data.last_update);
                elements.lastUpdate.textContent = `最終更新: ${updateTime.toLocaleTimeString('ja-JP')}`;
            }
        }

        // ステータス更新
        function updateStatus(status) {
            const statusText = {
                'idle': '待機中',
                'running': '処理中',
                'completed': '完了',
                'error': 'エラー'
            };

            elements.statusBadge.textContent = statusText[status] || status;
            elements.statusBadge.className = `status-badge status-${status}`;
        }

        // ログ更新
        function updateLogs(logs) {
            // 最新20件のログのみ表示
            const recentLogs = logs.slice(-20);

            recentLogs.forEach(log => {
                if (typeof log === 'object' && log.message) {
                    let className = 'info';
                    if (log.data) {
                        if (log.data.status === 'success') className = 'success';
                        else if (log.data.status === 'failed') className = 'failed';
                    }
                    addLog(log.message, className, false);
                }
            });
        }

        // ログ追加
        function addLog(message, type = 'info', scroll = true) {
            const logEntry = document.createElement('div');
            logEntry.className = `log-entry ${type} new`;
            logEntry.textContent = `[${new Date().toLocaleTimeString('ja-JP')}] ${message}`;

            elements.logContainer.appendChild(logEntry);

            // 最大100件のログを保持
            while (elements.logContainer.children.length > 100) {
                elements.logContainer.removeChild(elements.logContainer.firstChild);
            }

            if (scroll) {
                elements.logContainer.scrollTop = elements.logContainer.scrollHeight;
            }

            // アニメーション後にnewクラスを削除
            setTimeout(() => logEntry.classList.remove('new'), 1000);
        }

        // 更新インジケータ表示
        function showUpdateIndicator() {
            elements.updateIndicator.classList.add('show');
            setTimeout(() => {
                elements.updateIndicator.classList.remove('show');
            }, 1000);
        }

        // コントロール関数
        async function startProcess(type) {
            try {
                const response = await fetch(`http://localhost:5002/api/start/${type}`);
                const data = await response.json();
                addLog(`処理を開始しました: ${type}`, 'info');
            } catch (error) {
                addLog(`エラー: ${error.message}`, 'error');
            }
        }

        async function stopProcess() {
            try {
                const response = await fetch('http://localhost:5002/api/reset');
                const data = await response.json();
                addLog('処理を停止しました', 'info');
            } catch (error) {
                addLog(`エラー: ${error.message}`, 'error');
            }
        }

        function clearLogs() {
            elements.logContainer.innerHTML = '';
            addLog('ログをクリアしました', 'info');
        }

        // 初期化
        window.addEventListener('load', () => {
            console.log('ダッシュボード初期化');
            addLog('ダッシュボードを初期化しています...', 'info');
        });

        // 定期的な接続チェック
        setInterval(() => {
            if (!isConnected) {
                console.log('再接続を試行中...');
                socket.connect();
            }
        }, 5000);
    </script>
</body>
</html>
